<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayuda · Administración de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  :root {
    --ayuda-navy: #142a3f; --ayuda-navy-2: #204264; --ayuda-cream: #f8f3e9;
    --ayuda-copper: #bf5e1f; --ayuda-line: #e4ddd0; --ayuda-ink: #1c1c1c; --ayuda-muted: #6b6b6b;
  }
  .ayuda-hero {
    background: #0E2841;
    color: #fdfaf3; border-radius: 16px; padding: 34px 38px; margin-bottom: 26px;
  }
  .ayuda-hero .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(253,250,243,0.92); margin: 0 0 8px; }
  .ayuda-hero h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(1.5rem, 3vw, 2rem); margin: 0 0 8px; color: #FFC300; }
  .ayuda-hero p { color: rgba(253,250,243,0.92); margin: 0; max-width: 640px; line-height: 1.55; font-size: 0.94rem; }

  /* --- Grilla de tarjetas (portada) --- */
  .grilla-manuales { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .tarjeta-manual {
    background: #fff; border: 1px solid var(--ayuda-line); border-radius: 14px; padding: 22px;
    text-decoration: none; color: var(--ayuda-ink); transition: transform 0.1s, box-shadow 0.1s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tarjeta-manual:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(20,42,63,0.1); border-color: var(--ayuda-copper); }
  .tarjeta-manual .icono { font-size: 1.9rem; }
  .tarjeta-manual h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.02rem; margin: 0; color: var(--ayuda-navy); }
  .tarjeta-manual p { font-size: 0.85rem; color: var(--ayuda-muted); margin: 0; line-height: 1.4; }

  /* --- Vista de un manual --- */
  .manual-barra-superior { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .manual-actualizado { font-size: 0.78rem; color: var(--ayuda-muted); }
  .manual-seccion { background: #fff; border: 1px solid var(--ayuda-line); border-radius: 14px; padding: 24px 26px; margin-bottom: 18px; }
  .manual-seccion h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.15rem; color: var(--ayuda-navy); margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .manual-seccion .icono-seccion { font-size: 1.3rem; }
  .manual-seccion .descripcion-modulo { color: var(--ayuda-ink); font-size: 0.94rem; line-height: 1.65; margin: 10px 0 14px; }
  .badges-permiso { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge-permiso { font-size: 0.72rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; }
  .badge-ver { background: #e2ecf5; color: var(--ayuda-navy-2); }
  .badge-editar { background: #fbeadb; color: var(--ayuda-copper); }
  .badge-agregar { background: #e7f4ea; color: #1e7a3d; }
  .manual-pasos { margin: 0; padding-left: 20px; }
  .manual-pasos li { margin-bottom: 6px; font-size: 0.9rem; line-height: 1.55; color: var(--ayuda-ink); }
  .manual-vacio { text-align: center; padding: 50px 20px; color: var(--ayuda-muted); }

  /* --- Manual de instalación (documento técnico) --- */
  .doc-instalacion h2 { font-family: 'Fraunces', serif; color: var(--ayuda-navy); font-size: 1.1rem; margin: 28px 0 10px; }
  .doc-instalacion h2:first-child { margin-top: 0; }
  .doc-instalacion p, .doc-instalacion li { font-size: 0.92rem; line-height: 1.65; color: var(--ayuda-ink); }
  .doc-instalacion pre {
    background: var(--ayuda-navy); color: #e9f0f7; padding: 14px 16px; border-radius: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; overflow-x: auto; margin: 10px 0 16px; line-height: 1.6;
  }
  .doc-instalacion .aviso {
    background: #fbf1e4; border: 1px solid var(--ayuda-copper); border-left: 4px solid var(--ayuda-copper);
    border-radius: 8px; padding: 12px 16px; font-size: 0.88rem; margin: 14px 0;
  }

  @media (max-width: 640px) {
    .ayuda-hero { padding: 26px 22px; }
    .manual-seccion { padding: 20px; }
  }
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main">
    <div class="topbar">
      <div><div class="eyebrow">Ayuda</div><h1 id="titulo-pagina">Manuales</h1></div>
      <a href="/ayuda.html" class="btn-secundario btn-sm" id="btn-volver-portada" style="display:none; text-decoration:none;">← Todos los manuales</a>
    </div>

    <!-- Portada: grilla de los 9 manuales -->
    <div id="vista-portada">
      <div class="ayuda-hero">
        <p class="eyebrow">Centro de ayuda</p>
        <h1>Manuales de uso</h1>
        <p>Cada manual se genera automáticamente según lo que tu rol puede ver, editar y agregar en este momento — si un administrador cambia los permisos o el sistema se actualiza, el contenido se ajusta solo.</p>
      </div>
      <div class="grilla-manuales" id="grilla-manuales"></div>
    </div>

    <!-- Vista de un manual específico -->
    <div id="vista-manual" style="display:none;">
      <div class="ayuda-hero" id="manual-hero">
        <p class="eyebrow" id="manual-eyebrow">Manual</p>
        <h1 id="manual-titulo"></h1>
        <p id="manual-intro"></p>
      </div>
      <div class="manual-barra-superior">
        <span class="manual-actualizado" id="manual-actualizado"></span>
        <button class="btn-secundario btn-sm" id="btn-actualizar-manuales">🔄 Actualizar manuales</button>
      </div>
      <div id="manual-contenido"></div>
    </div>
  </main>
</div>

<script src="/js/common.js"></script>
<script>
const ICONOS_MANUAL = {
  instalacion: '🛠️', admin: '👑', coordinador: '🧭', lider: '🚩', sublider: '🤝',
  testigo: '📋', usuario: '🤝', asistente_administrativo: '🗂️', invitado: '👀'
};
const TITULOS_MANUAL = {
  instalacion: 'Manual de instalación', admin: 'Manual del administrador', coordinador: 'Manual del Coordinador',
  lider: 'Manual del Líder', sublider: 'Manual del Sublíder', testigo: 'Manual del Testigo',
  usuario: 'Manual del Usuario', asistente_administrativo: 'Manual del Asistente administrativo', invitado: 'Manual del Invitado'
};
const DESCRIPCIONES_MANUAL = {
  instalacion: 'Cómo instalar y mantener el servidor de la aplicación (solo para administradores técnicos).',
  admin: 'Control total: usuarios, permisos, configuración de la campaña, y todos los módulos.',
  coordinador: 'Supervisión de zonas y equipos — territorio, votantes, y comunicación con líderes.',
  lider: 'Registro y seguimiento del equipo de campo en tu territorio asignado.',
  sublider: 'Registro de votantes referidos por tu líder.',
  testigo: 'Consulta de información el día de las elecciones y previo a ellas.',
  usuario: 'Acceso operativo básico dentro de la estructura de campaña.',
  asistente_administrativo: 'Apoyo administrativo — gestión de datos sin acceso a configuración sensible.',
  invitado: 'Acceso de solo consulta a información pública de la campaña.'
};

/**
 * Descripción larga y consejos de uso por módulo — el nombre corto
 * (etiqueta) siempre viene en vivo desde /permisos/matriz; este
 * diccionario solo complementa con un texto explicativo y pasos, y si
 * aparece un módulo que no está aquí, se muestra igual con un texto
 * genérico (para que nunca falte información aunque se agregue un
 * módulo nuevo en el futuro).
 */
const INFO_MODULOS = {
  panel_general: { icono: '📊', texto: 'Vista general de la campaña: métricas de avance del equipo, resumen de votantes registrados y progreso frente a las metas.', pasos: ['Revisa el resumen general al iniciar sesión.', 'Usa los filtros de "Progreso del equipo" para ver quién va bien y quién necesita apoyo.'] },
  territorial: { icono: '🗺️', texto: 'Estructura territorial: Coordinadores, Líderes, Testigos y Coordinadores de Organizaciones, organizados por zona geográfica.', pasos: ['Usa "+ Nuevo" para agregar una persona a la estructura.', 'Completa el Territorio (Comuna/Barrio o Corregimiento/Vereda) según corresponda.', 'Revisa "Reporta a" para mantener la jerarquía correcta.'] },
  votantes: { icono: '📝', texto: 'Base de votantes y sublíderes referidos por el equipo — el corazón del trabajo de campo.', pasos: ['Usa "+ Nuevo votante o sublíder" para registrar un contacto.', 'Marca la categoría correcta (Votante o Sublíder).', 'La Intención de voto solo se registra con autorización de la persona.'] },
  organigrama: { icono: '🗂️', texto: 'Jerarquía interna de cargos de campaña (distinta de la estructura territorial) — quién ocupa cada cargo y a quién reporta.', pasos: ['Elige entre las vistas Diagrama, Lista o Tabla según lo que necesites ver.', 'Usa el botón de imprimir en cada cargo para exportar su ficha.'] },
  configuracion: { icono: '⚙️', texto: 'Datos generales de la campaña, usuarios del sistema, y la matriz de permisos que controla qué puede hacer cada rol.', pasos: ['Mantén actualizado el "Cargo al que aspira" — varias pantallas de la app lo usan para autocompletar datos.', 'Revisa la Asignación de permisos cada vez que cambie el equipo.'] },
  configurar_crm: { icono: '📧', texto: 'Credenciales de SendGrid (correo) y Twilio (SMS) que usa el módulo de CRM y mensajería.', pasos: ['Solo se configura una vez, al inicio de la campaña.'] },
  comunicaciones: { icono: '💬', texto: 'Envío de mensajes masivos o individuales por Email y SMS a votantes, estructura o el organigrama.', pasos: ['Arma grupos combinables por Territorio, Intención de voto, Categoría, etc.', 'Revisa el historial antes de reenviar, para no duplicar mensajes.'] },
  recursos: { icono: '📚', texto: 'Material de apoyo para compartir — imágenes, documentos, videos y piezas de publicidad de la campaña.', pasos: ['Descarga el material que necesites para compartir en redes o en persona.'] },
  biografia_candidato: { icono: '👤', texto: 'Biografía pública del candidato — trayectoria, foto y video de presentación.', pasos: [] },
  politica_privacidad: { icono: '🔒', texto: 'Política de privacidad de la campaña, conforme a la ley de protección de datos personales de Colombia.', pasos: [] },
  agenda: { icono: '📅', texto: 'Calendario de eventos y reuniones de la campaña.', pasos: ['Revisa la agenda del mes para conocer los próximos eventos.'] },
  finanzas: { icono: '💰', texto: 'Registro de ingresos y gastos de la campaña.', pasos: ['Cada movimiento debe quedar clasificado por categoría, con su comprobante si aplica.'] },
  eventos: { icono: '🎪', texto: 'Planeación y seguimiento de eventos de campaña (marchas, reuniones, actos públicos).', pasos: [] },
  social: { icono: '📱', texto: 'Monitoreo de redes sociales y opinión pública sobre la campaña.', pasos: [] },
  geo: { icono: '📍', texto: 'Mapa con la ubicación de estructura, votantes y eventos.', pasos: ['Usa los filtros para ver solo lo que te interesa en el mapa (por ejemplo, "Ninguno" en un campo para ocultarlo).'] },
  dashboard: { icono: '📊', texto: 'Panel general de métricas de la campaña.', pasos: [] }
};

function normalizarClaveManual(param) {
  // "admin" en la URL corresponde al rol "admin" en la matriz de permisos.
  return param;
}

async function cargarPortada(usuarioActual) {
  const todos = [
    { clave: 'instalacion' },
    { clave: 'admin' }, { clave: 'coordinador' }, { clave: 'lider' }, { clave: 'sublider' },
    { clave: 'testigo' }, { clave: 'usuario' }, { clave: 'asistente_administrativo' }, { clave: 'invitado' }
  ];
  // El administrador ve los 9 manuales; cualquier otro rol solo ve el
  // suyo propio (nunca el de instalación, que es documentación de
  // servidor exclusiva para administradores).
  const grupos = usuarioActual.rol === 'admin' ? todos : todos.filter(g => g.clave === usuarioActual.rol);

  document.getElementById('grilla-manuales').innerHTML = grupos.map(g => `
    <a class="tarjeta-manual" href="/ayuda.html?manual=${g.clave}">
      <div class="icono">${ICONOS_MANUAL[g.clave]}</div>
      <h3>${TITULOS_MANUAL[g.clave]}</h3>
      <p>${DESCRIPCIONES_MANUAL[g.clave]}</p>
    </a>
  `).join('');
}

function textoDocumentoInstalacion() {
  return `
    <h2>1. Requisitos del servidor</h2>
    <p>VPS con Ubuntu 24.04, MySQL 8.4+, Node.js 18 o más nuevo, y CloudPanel para administrar sitios, bases de datos y certificados SSL.</p>

    <h2>2. Crear el sitio y la base de datos</h2>
    <p>En CloudPanel: crea un sitio Node.js nuevo con su propio dominio/subdominio, y una base de datos MySQL nueva con su usuario dedicado.</p>

    <h2>3. Subir el proyecto y configurar el <code>.env</code></h2>
    <pre>cd ~/htdocs/tu-dominio.com
npm install
cp .env.example .env
nano .env</pre>
    <p>Estas son <strong>todas</strong> las variables que el programa lee, con lo que hace cada una:</p>
    <pre># --- Base de datos ---
DB_HOST=127.0.0.1          # NO uses "localhost": obliga a conectar por socket y falla
DB_USER=tu_usuario
DB_PASSWORD=tu_clave
DB_NAME=tu_base
DB_PORT=3306               # opcional; si falta se usa 3306

# --- Servidor ---
PORT=3002                  # el puerto interno al que apunta el proxy de CloudPanel
SESSION_SECRET=cadena_larga_y_distinta_en_cada_instalacion
NODE_ENV=production        # sin esto la cookie de sesion viaja SIN la marca de segura

# --- Licencia (sin esto la aplicacion no abre ni recibe actualizaciones) ---
LICENCIA_SERVIDOR_URL=https://licencias.appestrategia.net
LICENCIA_DOMINIO=tu-dominio.com
LICENCIA_CLAVE=XXXX-XXXX-XXXX-XXXX
LICENCIA_API_SECRET=el_mismo_que_tiene_el_servidor_de_licencias

# --- Geocodificacion de direcciones ---
GOOGLE_MAPS_API_KEY=...    # Google Cloud, con la "Geocoding API" activada

# --- Correo saliente (recuperar contrasena y avisos) ---
SMTP_HOST=...
SMTP_PORT=587
SMTP_SECURE=false
SMTP_USER=...
SMTP_PASSWORD=...
SMTP_FROM_NAME=Nombre de la campana

# --- Opcionales ---
MAPBOX_ACCESS_TOKEN=...    # mapa con mas detalle; sin esto usa el mapa libre
CATALOGO_DB=territoriosdb  # base del Catalogo Territorial; este es el valor por omision
PM2_NOMBRE_PROCESO=...     # solo si el proceso de PM2 no se detecta solo
ADMIN_EMAIL=...            # solo la PRIMERA vez, al crear el administrador
ADMIN_PASSWORD=...         # idem; ver el aviso del paso 4</pre>
    <div class="aviso">⚠️ Las contraseñas del <code>.env</code> que contengan el símbolo <code>#</code> deben ir entre comillas — si no, MySQL las interpreta como el inicio de un comentario y falla la conexión. Y si el valor trae comillas dobles <em>y</em> apóstrofes, no hay forma de escribirlo: hay que cambiarlo en el proveedor.</div>
    <div class="aviso">⚠️ El <code>SESSION_SECRET</code> se <strong>genera</strong> para cada instalación, nunca se copia de otra: compartirlo haría que una sesión abierta en una campaña valiera en la otra.</div>
    <div class="aviso">⚠️ Si una variable aparece <strong>dos veces</strong> en el archivo, manda la última y la primera queda muerta sin dar ningún error. Para comprobarlo: <code>grep -c '^CLAVE=' .env</code></div>
    <p><strong>Las llaves de Twilio y SendGrid no van aquí.</strong> Se configuran dentro de la aplicación, en <em>Configuración → Configurar CRM</em>, y ahí quedan guardadas en la base. El programa solo mira el <code>.env</code> si en esa pantalla no hay nada.</p>
    <div class="aviso">⚠️ Después de tocar el <code>.env</code>, <code>pm2 restart</code> <strong>no</strong> lo vuelve a leer. Hay que hacer el ciclo completo: <code>pm2 delete &lt;proceso&gt; &amp;&amp; pm2 start app.js --name &lt;proceso&gt; &amp;&amp; pm2 save</code></div>

    <h2>4. Inicializar la base de datos</h2>
    <pre>npm run init-db</pre>
    <p>Aplica el esquema completo y, si todavía no hay ningún administrador, crea uno.</p>
    <div class="aviso">⚠️ <strong>No pregunta nada: usa valores por omisión.</strong> Sin <code>ADMIN_EMAIL</code> y <code>ADMIN_PASSWORD</code> en el <code>.env</code>, el usuario queda como <code>admin@campana.local</code> con una contraseña por defecto que está escrita en el código y es igual en todas las instalaciones. Queda marcado para cambiarla en el primer ingreso, pero hasta que alguien entre, esa clave sirve. Lo correcto es poner las dos variables antes de correr este paso, o entrar de inmediato a cambiarla.</div>

    <h2>5. Arrancar con PM2</h2>
    <pre>pm2 start app.js --name campana-app
pm2 save
pm2 logs campana-app --lines 20 --nostream</pre>
    <div class="aviso">PM2 se instala por separado para cada usuario de sitio en CloudPanel (no es compartido con root) — si el comando <code>pm2</code> no se reconoce, corre <code>npm install -g pm2</code> primero con ese mismo usuario.</div>

    <h2>6. Conectar el dominio y el SSL</h2>
    <p>En CloudPanel, configura el proxy inverso (Nginx) apuntando al puerto del <code>.env</code>, y genera el certificado Let's Encrypt — si falla por "DNS problem: NXDOMAIN", falta agregar el registro <strong>A</strong> del subdominio en el proveedor de DNS, apuntando a la IP del VPS.</p>

    <h2>7. Aplicar parches (actualizaciones)</h2>
    <pre>cd ~/htdocs/tu-dominio.com
tar -czf ../backup-antes-parcheXX.tar.gz .   # si el parche toca la base de datos
unzip -o campana-parcheXX.zip -d .
npm run init-db    # SOLO si el parche incluye carpeta db/
pm2 restart campana-app</pre>
    <p>Los parches son acumulativos: deben aplicarse en orden, uno detrás de otro, nunca saltando números.</p>

    <h2>8. Problemas frecuentes</h2>
    <p><strong>La página no carga después de un parche:</strong> revisa <code>pm2 logs campana-app --lines 30 --nostream</code> — casi siempre es una dependencia nueva sin instalar (<code>npm install</code>) o un error de sintaxis.</p>
    <p><strong>"Access denied" al conectar a MySQL:</strong> la base de datos o el usuario no existen todavía, o la contraseña del <code>.env</code> no coincide exactamente con la de MySQL.</p>
    <p><strong>Un script de terminal se queda colgado sin terminar:</strong> prueba <code>Ctrl+C</code> para cancelarlo y vuelve a intentar.</p>
  `;
}

async function cargarManual(clave) {
  document.getElementById('vista-portada').style.display = 'none';
  document.getElementById('vista-manual').style.display = 'block';
  document.getElementById('btn-volver-portada').style.display = 'inline-block';
  document.getElementById('titulo-pagina').textContent = TITULOS_MANUAL[clave] || 'Manual';
  document.getElementById('manual-eyebrow').textContent = clave === 'instalacion' ? 'Documentación técnica' : 'Manual de uso';
  document.getElementById('manual-titulo').textContent = TITULOS_MANUAL[clave] || 'Manual';
  document.getElementById('manual-intro').textContent = DESCRIPCIONES_MANUAL[clave] || '';
  document.getElementById('manual-actualizado').textContent = `Generado: ${new Date().toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })}`;

  const contenedor = document.getElementById('manual-contenido');

  if (clave === 'instalacion') {
    contenedor.innerHTML = `<div class="manual-seccion doc-instalacion">${textoDocumentoInstalacion()}</div>`;
    return;
  }

  contenedor.innerHTML = `<div class="manual-vacio">Generando el manual según tus permisos actuales…</div>`;
  try {
    const { modulos, permisos } = await api('/permisos/matriz');
    const modulosConAcceso = modulos.filter(m => {
      const celda = permisos[`${clave}:${m.clave}`];
      return celda && (celda.ver || celda.editar || celda.agregar);
    });

    if (!modulosConAcceso.length) {
      contenedor.innerHTML = `<div class="manual-vacio">Este rol todavía no tiene ningún módulo habilitado en la Asignación de permisos.</div>`;
      return;
    }

    contenedor.innerHTML = modulosConAcceso.map(m => {
      const celda = permisos[`${clave}:${m.clave}`];
      const info = INFO_MODULOS[m.clave] || { icono: '📄', texto: 'Consulta con tu administrador sobre el uso de este módulo.', pasos: [] };
      return `
        <div class="manual-seccion">
          <h2><span class="icono-seccion">${info.icono}</span> ${m.etiqueta}</h2>
          <div class="badges-permiso">
            ${celda.ver ? '<span class="badge-permiso badge-ver">Puede ver</span>' : ''}
            ${celda.editar ? '<span class="badge-permiso badge-editar">Puede editar</span>' : ''}
            ${celda.agregar ? '<span class="badge-permiso badge-agregar">Puede agregar</span>' : ''}
          </div>
          <p class="descripcion-modulo">${info.texto}</p>
          ${info.pasos.length ? `<ul class="manual-pasos">${info.pasos.map(p => `<li>${p}</li>`).join('')}</ul>` : ''}
        </div>
      `;
    }).join('');
  } catch (err) {
    contenedor.innerHTML = `<div class="manual-vacio">No se pudo generar el manual en este momento. Intenta de nuevo, o usa "Actualizar manuales".</div>`;
  }
}

document.getElementById('btn-actualizar-manuales').addEventListener('click', () => {
  const params = new URLSearchParams(window.location.search);
  const manual = params.get('manual');
  if (manual) cargarManual(manual);
});

(async () => {
  const usuarioActual = await inicializarLayout('/ayuda.html');
  if (!usuarioActual) return;

  const params = new URLSearchParams(window.location.search);
  const manual = params.get('manual');

  if (manual && TITULOS_MANUAL[manual]) {
    if (manual === 'instalacion' && usuarioActual.rol !== 'admin') {
      window.location.href = '/ayuda.html';
      return;
    }
    await cargarManual(manual);
  } else {
    await cargarPortada(usuarioActual);
  }
})();
</script>
