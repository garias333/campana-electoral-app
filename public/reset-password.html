<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña · Administración de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-suelta">
  <div class="tarjeta-suelta">
    <div class="suelta-eyebrow">Estrategia · INGESES S.A.S.</div>
    <h1>Establece tu nueva contraseña</h1>
    <div id="reset-ok" class="mensaje-ok" style="display:none;"></div>
    <div id="reset-error" class="mensaje-error"></div>
    <form id="form-reset">
      <div class="campo">
        <label for="campo-nuevapassword">Nueva contraseña</label>
        <input id="campo-nuevapassword" type="password" name="nuevaPassword" minlength="8" required autofocus autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="campo-confirmar">Confirmar contraseña</label>
        <input id="campo-confirmar" type="password" name="confirmar" minlength="8" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primario">Guardar nueva contraseña</button>
    </form>
    <div class="suelta-pie"><a href="/login.html">Volver al inicio de sesión</a></div>
  </div>

<script src="/js/common.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('form-reset').style.display = 'none';
  const errorBox = document.getElementById('reset-error');
  errorBox.textContent = 'Enlace inválido: falta el token de recuperación.';
  errorBox.classList.add('visible');
}

document.getElementById('form-reset').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('reset-error');
  const okBox = document.getElementById('reset-ok');
  errorBox.classList.remove('visible');
  okBox.style.display = 'none';

  const datos = Object.fromEntries(new FormData(e.target));
  limpiarErrores(e.target);
  if (datos.nuevaPassword !== datos.confirmar) {
    mostrarErrorCampo(document.getElementById('campo-confirmar'), 'Las contraseñas no coinciden.');
    return;
  }

  const boton = e.target.querySelector('button');
  boton.disabled = true;
  try {
    await api('/auth/resetear-password', { method: 'POST', body: { token, nuevaPassword: datos.nuevaPassword } });
    okBox.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión con tu nueva contraseña.';
    okBox.style.display = 'block';
    e.target.style.display = 'none';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('visible');
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
