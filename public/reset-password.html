<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña · Administración de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--color-navy-lighter), var(--color-navy) 60%);
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: #fff; border-radius: 14px; padding: 36px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .login-eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-accent-dark); margin-bottom: 6px; }
  .login-card h1 { font-size: 1.25rem; margin-bottom: 22px; }
  .login-card button { width: 100%; margin-top: 6px; }
  .pie-login { text-align: center; margin-top: 18px; font-size: 0.76rem; color: var(--color-text-muted); }
  .mensaje-ok { background: #ECFDF3; border: 1px solid #ABEFC6; color: #067647; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-eyebrow">Estrategia · INGESES S.A.S.</div>
    <h1>Establece tu nueva contraseña</h1>
    <div id="reset-ok" class="mensaje-ok" style="display:none;"></div>
    <div id="reset-error" class="mensaje-error"></div>
    <form id="form-reset">
      <div class="campo">
        <label>Nueva contraseña</label>
        <input type="password" name="nuevaPassword" minlength="8" required autofocus>
      </div>
      <div class="campo">
        <label>Confirmar contraseña</label>
        <input type="password" name="confirmar" minlength="8" required>
      </div>
      <button type="submit" class="btn-primario">Guardar nueva contraseña</button>
    </form>
    <div class="pie-login"><a href="/login.html" style="color: var(--color-text-muted);">Volver al inicio de sesión</a></div>
  </div>

<script src="/js/common.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('form-reset').style.display = 'none';
  const errorBox = document.getElementById('reset-error');
  errorBox.textContent = 'Enlace inválido: falta el token de recuperación.';
  errorBox.classList.add('visible');
}

document.getElementById('form-reset').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('reset-error');
  const okBox = document.getElementById('reset-ok');
  errorBox.classList.remove('visible');
  okBox.style.display = 'none';

  const datos = Object.fromEntries(new FormData(e.target));
  if (datos.nuevaPassword !== datos.confirmar) {
    errorBox.textContent = 'Las contraseñas no coinciden.';
    errorBox.classList.add('visible');
    return;
  }

  const boton = e.target.querySelector('button');
  boton.disabled = true;
  try {
    await api('/auth/resetear-password', { method: 'POST', body: { token, nuevaPassword: datos.nuevaPassword } });
    okBox.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión con tu nueva contraseña.';
    okBox.style.display = 'block';
    e.target.style.display = 'none';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('visible');
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
