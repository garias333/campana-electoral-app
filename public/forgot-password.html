<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Administración de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-suelta">
  <div class="tarjeta-suelta">
    <div class="suelta-eyebrow">Estrategia · INGESES S.A.S.</div>
    <h1>Recuperar contraseña</h1>
    <p class="suelta-descripcion">Escribe el correo con el que ingresas al sistema. Si está registrado, te enviaremos un enlace para restablecer tu contraseña.</p>
    <div id="forgot-ok" class="mensaje-ok" style="display:none;"></div>
    <div id="forgot-error" class="mensaje-error"></div>
    <form id="form-forgot">
      <div class="campo">
        <label for="campo-email">Correo electrónico</label>
        <input id="campo-email" type="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn-primario">Enviar enlace de recuperación</button>
    </form>
    <div class="suelta-pie"><a href="/login.html">Volver al inicio de sesión</a></div>
  </div>

<script src="/js/common.js"></script>
<script>
document.getElementById('form-forgot').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('forgot-error');
  const okBox = document.getElementById('forgot-ok');
  errorBox.classList.remove('visible');
  okBox.style.display = 'none';
  const datos = Object.fromEntries(new FormData(e.target));
  const boton = e.target.querySelector('button');
  boton.disabled = true;
  try {
    const resp = await api('/auth/olvidar-password', { method: 'POST', body: datos });
    okBox.textContent = resp.mensaje;
    okBox.style.display = 'block';
    e.target.reset();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('visible');
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
