<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legislación · Administración de Campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/legislacion.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main">
    <div class="sec-hero">
      <div class="eyebrow">Consulta</div>
      <h1>Legislación</h1>
      <p>El calendario electoral, un buscador dentro del texto de las normas y los PDF de las leyes, decretos y resoluciones.</p>
    </div>
    <div id="leg-raiz"></div>
  </main>
</div>

<script src="/js/common.js"></script>
<script src="/js/legislacion-comun.js"></script>
<script>
(async () => {
  const usuarioActual = await inicializarLayout('/legislacion.html');
  if (!usuarioActual) return;

  Legis.montar(document.getElementById('leg-raiz'), {
    /* En el escritorio un enlace normal basta: la cookie de sesión viaja sola y, con
       «#page=N», el visor de PDF del navegador abre en esa página. `window.open` se llama
       de inmediato, dentro del clic, que es lo que no bloquea el navegador. */
    abrirPdf: async (accion, norma, pagina) => {
      const base = `/api/legislacion/archivo/${encodeURIComponent(norma.archivo)}`;
      if (accion === 'descargar') { window.location.href = `${base}?descargar=1`; return; }
      window.open(base + (pagina ? `#page=${pagina}` : ''), '_blank', 'noopener');
    }
  });
})();
</script>
</body>
</html>
