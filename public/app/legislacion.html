<script>
/* «VER» Y «DESCARGAR» PIDEN EL PDF CON fetch, NO CON UN ENLACE.
   Un enlace es una navegación del navegador y SOLO lleva la cookie de sesión. Pero esa cookie
   dura 8 horas fijas (app.js: cookie.maxAge, sin rolling) y el token de dispositivo de
   «Recordar sesión» dura 7 días (config/tokenDispositivo.js), y el token solo viaja como
   encabezado X-Device-Token (api-core.js). Con la pantalla abierta pasadas las 8 horas, o con
   la cookie borrada, el enlace mostraba el JSON «Debe iniciar sesión» aunque la sesión del
   dispositivo siguiera vigente. fetch manda el MISMO encabezado que el resto de la app, y de
   paso el servidor renueva la cookie en la respuesta. El token nunca va en la dirección. */
async function pedirPdf(norma, descargar) {
  const encabezados = {};
  const token = (typeof obtenerTokenDispositivoActivo === 'function') ? obtenerTokenDispositivoActivo() : null;
  if (token) encabezados['X-Device-Token'] = token;

  let resp;
  try {
    resp = await fetch(`/api/legislacion/archivo/${encodeURIComponent(norma.archivo)}${descargar ? '?descargar=1' : ''}`,
      { headers: encabezados, credentials: 'same-origin' });
  } catch (err) {
    const e = new Error('Se necesita conexión a internet para abrir la norma.');
    e.esErrorDeRed = true;
    throw e;
  }
  if (resp.status === 401) { window.location.href = '/login.html'; return null; }   // igual que api()
  if (!resp.ok) {
    let mensaje = 'No se pudo abrir la norma.';
    try { const j = await resp.json(); if (j && j.error) mensaje = j.error; } catch (e) { /* sin cuerpo JSON */ }
    throw new Error(mensaje);
  }
  // El tipo se fija a mano: si el visor recibe un blob sin tipo, no sabe qué es.
  return new Blob([await resp.arrayBuffer()], { type: 'application/pdf' });
}

/* QUÉ SE HACE CON EL BLOB, Y POR QUÉ.
   Ver: se navega la MISMA ventana al blob. Descartado `window.open`/target _blank: tras el
   `await` del fetch ya no hay gesto del usuario y Safari lo bloquea como ventana emergente.
   Descartado un iframe/embed: Safari de iPhone muestra solo la PRIMERA página de un PDF
   incrustado y Chrome de Android no tiene visor de PDF incrustado. Una navegación de la
   ventana actual no está sujeta al bloqueo y Safari abre su visor nativo, con todas las
   páginas; se vuelve con el gesto/botón de atrás. (Función aparte para poder sustituirla en
   las pruebas.) */
function mostrarPdfEnPantalla(urlBlob) {
  window.location.assign(urlBlob);
}

function guardarPdf(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp('Legislación', null, '/app/inicio.html');
  // El administrador conserva su barra inferior también aquí («Ley» es su quinto botón).
  if (usuario.rol === 'admin' && typeof montarNavAdmin === 'function') montarNavAdmin('ley');

  Legis.montar(document.getElementById('leg-raiz'), {
    abrirPdf: async (accion, norma, pagina) => {
      const blob = await pedirPdf(norma, accion === 'descargar');
      if (!blob) return;   // fue a login
      if (accion === 'descargar') guardarPdf(blob, norma.archivo);
      // «#page=N»: Safari de iPhone lo ignora y abre en la primera página; Chrome lo respeta.
      else mostrarPdfEnPantalla(URL.createObjectURL(blob) + (pagina ? `#page=${pagina}` : ''));
    }
  });
})();
</script>
