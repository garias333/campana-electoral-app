<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142a3f">
<title>Encuestas · Estrategia</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estrategia">
<link rel="stylesheet" href="/app/estilos-app.css">
<style>
  /* ENCUESTAS INTERNAS, la lista en el celular (parche 307): las encuestas para aplicar y lo que sigue en este celular sin subir. */
  .uso-interno { background: #fdf3e0; border: 1px solid #ecd3a4; border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; font-weight: 700; color: #7a4b00; margin: 0 0 12px; }
  .grupo-titulo { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  .caja-enc { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; }
  .caja-enc .nombre { font-weight: 700; color: var(--navy); overflow-wrap: anywhere; }
  .caja-enc .meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .caja-enc p { font-size: 0.88rem; margin: 8px 0 0; line-height: 1.4; }
  .acciones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones .btn-app { flex: 1 1 120px; margin: 0; }
  .etiqueta { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--cream); color: var(--navy); white-space: nowrap; border: 1px solid var(--linea); margin-left: 4px; }
  .etiqueta.roja { background: #fbe9e7; border-color: #f2b8b3; color: var(--error); }
  .etiqueta.ambar { background: #fdf3e0; border-color: #ecd3a4; }
  .vacio-app { text-align: center; color: var(--muted); padding: 26px 8px; }
  .bloqueo { background: #fbe9e7; border: 1px solid #f2b8b3; border-radius: 12px; padding: 14px; color: var(--error); font-weight: 600; }
</style>
</head>
<body>

<div class="app-barra" id="app-barra"></div>

<main class="app-cuerpo">
  <div id="aviso" class="aviso-app"></div>
  <p class="uso-interno">Uso interno – no publicable. Las encuestas son anónimas: no pidas nombre, cédula ni teléfono.</p>

  <div id="bloque-pendientes" style="display:none;">
    <p class="grupo-titulo">En este celular, sin subir</p>
    <div id="lista-pendientes"></div>
  </div>

  <div id="lista-servidor"><p class="vacio-app">Cargando…</p></div>
  <p id="nota-copia" style="display:none; font-size:0.78rem; color:var(--muted);"></p>
</main>

<script src="/js/api-core.js"></script>
<script src="/js/form-utils.js"></script>
<script src="/js/offline-utils.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/js/encuestas-cola.js"></script>
<script src="/app/app-comun.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => escaparAppHtml(t);
let datos = null;           // lo último que dijo el servidor (o la copia)
let cola = [];

function aviso(texto, tipo) {
  const a = $('aviso');
  a.textContent = texto || '';
  a.className = 'aviso-app' + (texto ? ' visible ' + (tipo || 'error') : '');
}

async function cargarServidor() {
  let copia = false;
  try {
    datos = await api('/encuestas/campo');
    if (datos) { try { await guardarCopiaOffline('encuestas_cache', 'campo', datos); } catch (_) { /* sin espacio: se sigue sin copia */ } }
  } catch (e) {
    if (!(e && e.esErrorDeRed)) {                         // un rechazo real (por ejemplo, sin permiso): no se muestra una copia vieja
      datos = null;
      $('lista-servidor').innerHTML = `<p class="vacio-app">${esc((e && e.message) || 'No se pudo cargar la lista.')}</p>`;
      return false;
    }
    const c = await leerCopiaOffline('encuestas_cache', 'campo').catch(() => null);
    datos = c ? c.datos : null;
    copia = !!datos;
  }
  if (!datos) { $('lista-servidor').innerHTML = '<p class="vacio-app">No se pudo cargar la lista. Con señal se carga sola.</p>'; return false; }
  $('nota-copia').style.display = copia ? 'block' : 'none';
  if (copia) $('nota-copia').textContent = 'Sin señal: se muestran las encuestas guardadas la última vez en este celular.';
  return true;
}

function pintarPendientes() {
  $('bloque-pendientes').style.display = cola.length ? 'block' : 'none';
  $('lista-pendientes').innerHTML = cola.slice().sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0)).map((r) => {
    const fallida = r.estado === 'fallido';
    return `<div class="caja-enc" data-pendiente="${esc(r.clienteUuid)}"><div style="display:flex;justify-content:space-between;gap:8px;"><span class="nombre">${esc(r.titulo || 'Encuesta')}</span>
      <span class="etiqueta ${fallida ? 'roja' : 'ambar'}">${fallida ? 'No se pudo subir' : 'Esperando señal'}</span></div>
      <div class="meta">${esc((r.zonaTexto || '') + (r.zonaTexto ? ' · ' : ''))}tomada el ${esc(new Date(r.creadoEn || Date.now()).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</div>
      ${fallida ? `<div class="meta" style="color:var(--error); margin-top:6px;" data-error>${esc(r.error || '')}</div>
        <div class="acciones"><button type="button" class="btn-app btn-app-primario" data-reintentar="${esc(r.clienteUuid)}">Reintentar</button>
        <button type="button" class="btn-app btn-app-secundario" data-descartar="${esc(r.clienteUuid)}">Descartar</button></div>` : ''}</div>`;
  }).join('');
  $('lista-pendientes').querySelectorAll('[data-reintentar]').forEach((b) => b.addEventListener('click', async () => { await reintentarEncuestasFallidas(); await refrescar(); }));
  $('lista-pendientes').querySelectorAll('[data-descartar]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('¿Descartar esta encuesta? Se pierde: no se subirá.')) return;
    await borrarDeColaOffline(ENCUESTAS_STORE, b.dataset.descartar);
    await refrescar();
  }));
}

function pintar() {
  pintarPendientes();
  const L = $('lista-servidor');
  if (!datos) return;
  const hoy = hoyEnColombia();
  const bloqueo = datos.bloqueo || (datos.fecha_eleccion && datos.fecha_eleccion === hoy ? { mensaje: 'Hoy es el día de la elección y ese día no se aplica ninguna encuesta. Vuelve a abrirla mañana.' } : null);
  if (bloqueo) { L.innerHTML = `<p class="bloqueo" id="bloqueo">${esc(bloqueo.mensaje)}</p>`; return; }
  const lista = datos.encuestas || [];
  L.innerHTML = lista.length ? `<p class="grupo-titulo">Para aplicar</p>` + lista.map((e) => `<div class="caja-enc" data-encuesta="${esc(e.id)}">
      <div class="nombre">${esc(e.titulo)}</div>
      <div class="meta">${esc(e.preguntas.length)} pregunta(s)${e.pide_ubicacion ? ' · puede usar tu ubicación (opcional)' : ''}</div>
      ${e.descripcion ? `<p>${esc(e.descripcion)}</p>` : ''}
      <div class="acciones"><button type="button" class="btn-app btn-app-primario" data-iniciar="${esc(e.id)}">Empezar</button></div></div>`).join('')
    : `<p class="vacio-app">No hay encuestas para aplicar.${datos.suspendidas ? ' Algunas están suspendidas por las reglas de la campaña.' : ''}</p>`;
  L.querySelectorAll('[data-iniciar]').forEach((b) => b.addEventListener('click', () => {
    try { sessionStorage.setItem('encuesta_a_aplicar', b.dataset.iniciar); } catch (_) { /* sin sessionStorage: la otra pantalla vuelve a esta */ }
    window.location.href = '/app/encuesta-aplicar.html';
  }));
}

async function refrescar() {
  cola = await colaDeEncuestas();
  await cargarServidor();
  cola = await colaDeEncuestas();
  pintar();
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp('Encuestas', 'Aplicar una encuesta, también sin señal', '/app/inicio.html');
  cola = await colaDeEncuestas();
  if (cola.some((r) => r.estado !== 'fallido')) await sincronizarEncuestas();
  await refrescar();
  window.addEventListener('online', async () => { await sincronizarEncuestas(); await refrescar(); });
})();
</script>
</body>
</html>
