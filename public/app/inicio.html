<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142a3f">
<title>Estrategia · Captura de Campo</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estrategia">
<link rel="stylesheet" href="/app/estilos-app.css">
<link rel="stylesheet" href="/app/panel-lider.css">
</head>
<body>
<div class="app-barra" id="app-barra"></div>
<main class="app-cuerpo">

  <div class="campana-card" id="campana-card" style="display:none;">
    <div class="campana-avatar" id="campana-avatar">
      <img id="campana-foto" style="display:none;" alt="">
      <span id="campana-iniciales"></span>
    </div>
    <div class="campana-info">
      <h1 id="campana-nombre"></h1>
      <p class="campana-meta" id="campana-meta"></p>
      <p class="campana-partido" id="campana-partido" style="display:none;"></p>
      <p class="campana-slogan" id="campana-slogan" style="display:none;"></p>
    </div>
  </div>

  <div id="saludo" class="saludo-app"></div>

  <!-- AVISOS DE ALERTAS (Día D). Sólo para quien tiene el módulo «Alertas del Día D» y todavía no activó los avisos en este
       celular. Se puede cerrar (se recuerda en este dispositivo). Lleva a la casilla de avisos, abajo en esta misma pantalla. -->
  <div id="franja-avisos-alertas" style="display:none; background:#FDF3E0; border:1px solid #E5C27A; color:#6B4A00; border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:0.9rem;">
    <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
      <div><strong>Activa los avisos para el día de la elección.</strong><br>
        Así te llega una notificación cuando hay una alerta (un testigo que no llega, una mesa sin E-14…), aunque no tengas la app abierta.
        <br><a href="#caja-avisos-push" id="enlace-activar-avisos" style="font-weight:700; color:#6B4A00;">Activar los avisos →</a></div>
      <button type="button" id="cerrar-franja-avisos" aria-label="Cerrar" style="border:0; background:transparent; font-size:1.3rem; line-height:1; cursor:pointer; color:#6B4A00;">×</button>
    </div>
  </div>

  <!-- PANEL DEL LÍDER (líder, sublíder y aspirante con rol líder): meta, 7 días, pendientes, equipo, lugar y Día D. Lo arma public/app/panel-lider.js. -->
  <section id="panel-lider" aria-label="Mi panel" hidden></section>

  <nav class="menu-app" id="menu-app"></nav>

  <!-- Ofrecer la instalación también desde dentro: quien entró por el
       navegador y todavía no la tiene instalada, la instala de un toque. -->
  <div id="zona-instalar-app" style="display:none; margin-top:18px;"></div>

  <button class="btn-app btn-app-secundario btn-app-espaciado" id="btn-cerrar-sesion">Cerrar sesión</button>
</main>

<script src="/js/api-core.js"></script>
<script src="/js/offline-utils.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/js/avisos-push.js"></script>
<script src="/app/app-comun.js"></script>
<script src="/app/panel-lider.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/js/instalar-app.js"></script>
<script>
const CARGOS = {
  senado: 'Senado', camara_representantes: 'Cámara de Representantes',
  gobernacion: 'Gobernación', asamblea: 'Asamblea', alcaldia: 'Alcaldía',
  concejo: 'Concejo', jal: 'JAL'
};

function iniciales(nombre) {
  const partes = (nombre || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return partes.map(p => p[0].toUpperCase()).join('') || '—';
}

/** Quita un prefijo tipo "Candidato: " si alguien lo escribió dentro del campo de nombre en Configuración — solo afecta cómo se muestra acá, no el dato guardado. */
function limpiarNombreCandidato(nombre) {
  return (nombre || '').replace(/^\s*candidato\s*:\s*/i, '').trim();
}

// Menú de líder y sublíder.
const MENU_LIDER = [
  { href: '/app/mis-registros.html', icono: '📝', titulo: 'Registro de votantes y sublíderes', subtitulo: 'Ver tu avance y agregar contactos' },
  // Tu enlace y tu QR de inscripción: la gente se inscribe sola desde su celular y queda en tu lista.
  // MENU_COORDINADOR hereda esta entrada (se arma con ...MENU_LIDER); el administrador no tiene enlace propio.
  { href: '/app/mi-enlace.html', icono: '🔗', titulo: 'Mi enlace de inscripción', subtitulo: 'Tu QR para que la gente se inscriba sola' },
  // Día D: quién de los míos ya votó y quién falta. Solo con «Ver» en el módulo `rescate_votos`.
  { href: '/app/faltantes.html', icono: '🗳️', titulo: 'Faltan por votar', subtitulo: 'Tus votantes del día de la elección', modulo: 'rescate_votos' },
  // El aspirante (rol «lider» con sublicencia) también ve el ranking de SU rama. Un líder
  // corriente no: por eso `soloAspirante`. El coordinador ya lo tiene en su menú.
  { href: '/app/ranking-dia-d.html', icono: '🏁', titulo: 'Ranking Día D', subtitulo: 'Cómo va cada líder de tu equipo', modulo: 'rescate_votos', soloAspirante: true },
  { href: '/app/biografia.html', icono: '👤', titulo: 'Biografía del candidato', subtitulo: 'Conoce su trayectoria' },
  { href: '/app/informacion.html?modo=informacion', icono: '📚', titulo: 'Información para compartir', subtitulo: 'Materiales y contenidos de apoyo' },
  { href: '/app/puesto-votacion.html', icono: '🗳️', titulo: 'Consultar puesto de votación', subtitulo: 'Página oficial de la Registraduría' },
  { href: '/app/politica-privacidad.html', icono: '🔒', titulo: 'Política de privacidad', subtitulo: 'Cómo se protege tu información' },
  // `modulo`: la entrada solo se pinta si el rol tiene «Ver» en ese módulo de
  // Asignación de permisos (ver pintarMenu). Sin `modulo`, siempre se pinta.
  { href: '/app/legislacion.html', icono: '⚖️', titulo: 'Legislación', subtitulo: 'Leyes y normas en PDF', modulo: 'legislacion' },
  // Ayuda (orden Manuales 2): tu manual, con lo que tus permisos de hoy te dejan hacer. Sin `modulo`: la ven todos. El coordinador la hereda.
  { href: '/ayuda.html', icono: '❔', titulo: 'Ayuda', subtitulo: 'Tu manual: pasos, preguntas y glosario' },
];

// Menú de coordinador. Lo de siempre del líder —registrar, biografía, material,
// puesto de votación y política— MÁS lo que un coordinador necesita y un líder no:
// ver cómo va cada líder a su cargo, y llegar al panel completo.
//
// «Avance de mis líderes» va primero porque es para lo que un coordinador abre la
// aplicación en la calle. «Panel completo» va al final y abre el panel de
// escritorio: no hay pantalla móvil para todo lo que ahí se hace, y un coordinador
// que entra desde el celular antes caía directamente en él sin otra opción.
const MENU_COORDINADOR = [
  { href: '/app/avance-lideres.html', icono: '📊', titulo: 'Avance de mis líderes', subtitulo: 'Cuánto lleva cada líder frente a su meta' },
  { href: '/app/alertas-dia-d.html', icono: '🚨', titulo: 'Alertas Día D', subtitulo: 'Mesas sin testigo, llegadas, E-14 y baja votación', modulo: 'alertas_dia_d' },
  { href: '/app/ranking-dia-d.html', icono: '🏁', titulo: 'Ranking Día D', subtitulo: 'Cómo va cada líder el día de la elección', modulo: 'rescate_votos' },
  { href: '/dia-d.html#transporte', icono: '🚐', titulo: 'Transporte Día D', subtitulo: 'Vehículos, conductores y recogidas', modulo: 'transporte_dia_d' },
  { href: '/app/logistica.html', icono: '🥪', titulo: 'Logística Día D', subtitulo: 'Refrigerios y kits por puesto', modulo: 'logistica_dia_d' },
  ...MENU_LIDER,
  { href: '/dashboard.html', icono: '🖥️', titulo: 'Panel completo', subtitulo: 'Abrir el panel de escritorio' },
];

// Menú de administrador. EL ORDEN ES EL PEDIDO, no alfabético ni por frecuencia: las
// nueve primeras entradas van tal cual las definió la campaña; lo que se agregue después
// va DESPUÉS de ellas.
// Panel general, Dashboard de votantes, Mapa territorial, Estructura territorial (la lista) y
// Compartir contenido tienen versión propia para el celular (admin-*.html, con su barra
// inferior de cinco botones: ver admin-nav.js). «Agregar coordinadores o líderes» abre el
// formulario de escritorio (territorial.html) con `?app=1` —en modo app: sin menú lateral,
// con «← Volver a la app» y el formulario por pasos— y #nuevo, que lo abre de una vez (ver
// la cabecera y el final de territorial.html); el `?app=1` no interfiere: el #nuevo es el hash.
// No incluye Biografía del candidato ni Política de privacidad: el administrador las
// edita desde Compartir contenido.
const MENU_ADMIN = [
  { href: '/app/admin-panel.html', icono: '📊', titulo: 'Panel general', subtitulo: 'Cifras, equipo, posiciones y eventos' },
  { href: '/app/admin-estructura.html', icono: '🏛️', titulo: 'Estructura territorial', subtitulo: 'Coordinadores, líderes y sublíderes' },
  { href: '/territorial.html?app=1#nuevo', icono: '👥', titulo: 'Agregar coordinadores o líderes', subtitulo: 'Sumar a alguien nuevo a la estructura' },
  { href: '/app/admin-votantes.html', icono: '📈', titulo: 'Dashboard de votantes', subtitulo: 'Cobertura y votantes por zona, líder y puesto' },
  { href: '/app/registro-votante.html', icono: '📝', titulo: 'Registro de votantes', subtitulo: 'Agregar un nuevo contacto al equipo' },
  { href: '/app/admin-mapa.html', icono: '🗺️', titulo: 'Mapa territorial', subtitulo: 'Equipo, votantes y eventos en el mapa' },
  { href: '/app/puesto-votacion.html', icono: '🗳️', titulo: 'Consultar puesto de votación', subtitulo: 'Página oficial de la Registraduría' },
  { href: '/app/legislacion.html', icono: '⚖️', titulo: 'Legislación', subtitulo: 'Leyes y normas en PDF', modulo: 'legislacion' },
  { href: '/app/admin-contenido.html', icono: '📣', titulo: 'Compartir contenido', subtitulo: 'Subir, compartir y administrar materiales' },
  // Día D (fase 2): van DESPUÉS de las nueve del orden pedido.
  { href: '/app/alertas-dia-d.html', icono: '🚨', titulo: 'Alertas Día D', subtitulo: 'Mesas sin testigo, llegadas, E-14 y baja votación', modulo: 'alertas_dia_d' },
  { href: '/app/faltantes.html', icono: '🗳️', titulo: 'Faltan por votar', subtitulo: 'Los votantes que aún no han votado', modulo: 'rescate_votos' },
  { href: '/app/ranking-dia-d.html', icono: '🏁', titulo: 'Ranking Día D', subtitulo: 'Cómo va cada líder el día de la elección', modulo: 'rescate_votos' },
  { href: '/dia-d.html#transporte', icono: '🚐', titulo: 'Transporte Día D', subtitulo: 'Vehículos, conductores y recogidas', modulo: 'transporte_dia_d' },
  { href: '/app/logistica.html', icono: '🥪', titulo: 'Logística Día D', subtitulo: 'Refrigerios y kits por puesto', modulo: 'logistica_dia_d' },
  { href: '/ayuda.html', icono: '❔', titulo: 'Ayuda', subtitulo: 'Los manuales de cada rol, y el de instalación' },
  // Después de las nueve. Solo aparece si el administrador eligió «Ver versión de
  // escritorio» en el Panel: volver a la del celular borra esa preferencia (la recoge
  // admin-panel.html).
  { href: '/app/admin-panel.html?celular=1', icono: '📱', titulo: 'Usar la versión de celular', subtitulo: 'Hoy entras al panel de escritorio', soloSiEscritorio: true },
];

/* Módulos que este usuario puede VER según Asignación de permisos
   (/permisos/mios). Hasta ahora ninguna entrada de este menú dependía de eso;
   la primera es Legislación. Si la consulta falla o tarda —sin señal—, queda
   en [] y las entradas con `modulo` simplemente no se pintan: Legislación
   necesita conexión de todos modos. Las entradas SIN `modulo` no cambian. */
async function modulosPermitidosApp() {
  try {
    const permisos = await Promise.race([
      api('/permisos/mios'),
      new Promise((_, rechazar) => setTimeout(() => rechazar(new Error('tarda')), 2500))
    ]);
    return (permisos && permisos.modulos) || [];
  } catch (err) {
    return [];
  }
}

function pintarMenu(rol, modulosPermitidos, esAspirante) {
  const base = rol === 'admin' ? MENU_ADMIN : (rol === 'coordinador' ? MENU_COORDINADOR : MENU_LIDER);
  let prefiereEscritorio = false;
  try { prefiereEscritorio = localStorage.getItem('admin_preferir_escritorio') === '1'; } catch (e) { /* sin almacenamiento */ }
  const items = base.filter(it => (!it.modulo || (modulosPermitidos || []).includes(it.modulo))
                              && (!it.soloSiEscritorio || prefiereEscritorio)
                              && (!it.soloAspirante || esAspirante));
  document.getElementById('menu-app').innerHTML = items.map(it => `
    <a class="menu-boton" href="${it.href}">
      <div class="icono" aria-hidden="true">${it.icono}</div>
      <div class="texto"><strong>${it.titulo}</strong><span>${it.subtitulo}</span></div>
      <div class="flecha" aria-hidden="true">›</div>
    </a>`).join('');
}

function pintarCampana(campana, bio) {
  if (!campana || !campana.nombre_candidato) return; // sin datos configurados aún: se deja oculto

  const nombre = limpiarNombreCandidato(campana.nombre_candidato);
  document.getElementById('campana-nombre').textContent = nombre;

  const metaPartes = [CARGOS[campana.cargo_aspira], campana.ciudad].filter(Boolean);
  document.getElementById('campana-meta').textContent = metaPartes.join(' · ');

  if (campana.partido_politico) {
    const partidoEl = document.getElementById('campana-partido');
    partidoEl.textContent = campana.partido_politico;
    partidoEl.style.display = 'block';
  }

  if (campana.slogan_campana) {
    const sloganEl = document.getElementById('campana-slogan');
    sloganEl.textContent = `“${campana.slogan_campana}”`;
    sloganEl.style.display = 'block';
  }

  // Misma fuente y mismo criterio de respaldo que biografia.html: foto si
  // hay una guardada en Biografía del candidato, si no, iniciales.
  if (bio && bio.foto_url) {
    const img = document.getElementById('campana-foto');
    img.src = bio.foto_url;
    img.style.display = 'block';
  } else {
    document.getElementById('campana-iniciales').textContent = iniciales(nombre);
  }

  document.getElementById('campana-card').style.display = 'flex';
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;

  // Esta pantalla es el "start_url" fijo del manifest de la PWA — cuando
  // alguien la instala en el celular, el ícono SIEMPRE abre acá, sin
  // importar el rol de quien esté conectado en ese momento (el manifest
  // no puede ser distinto por rol). Un testigo nunca debe ver el menú de
  // líder/sublíder: se manda directo a su única pantalla de trabajo.
  if (usuario.rol === 'testigo') {
    window.location.replace('/app/dia-d.html');
    return;
  }

  pintarBarraApp('Estrategia', null, null);
  document.getElementById('saludo').textContent = `Hola, ${usuario.nombre}`;
  const modulosApp = await modulosPermitidosApp();
  pintarMenu(usuario.rol, modulosApp, !!usuario.es_aspirante);
  mostrarFranjaDeAvisos(modulosApp);
  // El panel del líder va arriba del menú. Quien no es líder ni sublíder (ni aspirante, que entra con rol líder) no lo pide.
  if (['lider', 'sublider'].includes(usuario.rol) && window.PanelLider) window.PanelLider.iniciar(usuario);

  try {
    const [campana, bio] = await Promise.all([
      api('/configuracion/campana'),
      api('/contenido/biografia_candidato').catch(() => ({}))
    ]);
    pintarCampana(campana, bio);
  } catch (err) {
    // Si falla la consulta, simplemente no se muestra la tarjeta — el resto de la pantalla sigue funcionando igual.
  }
})();

document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
  // Avisar al servidor es "mejor esfuerzo": sin conexión esa llamada
  // fallaría y antes se quedaba pegada el botón. Cerrar sesión en este
  // celular no puede depender de tener señal en ese momento.
  try { await api('/auth/logout', { method: 'POST' }); } catch (err) {}
  // Deja de haber una cuenta ACTIVA, pero no se "olvida" — sigue
  // apareciendo en el selector de /login.html para que otra persona (o la
  // misma más tarde) pueda volver a entrar sin escribir la contraseña.
  desactivarCuentaDispositivo();
  window.location.href = '/login.html';
});

/* La franja «Activa los avisos». Sólo si la persona tiene el módulo de alertas y NINGÚN dispositivo suscrito; la ruta
   /dia-d/alertas/mis-avisos responde 403 a quien no tiene el módulo, y entonces no se ofrece. Se puede cerrar. */
async function mostrarFranjaDeAvisos(modulos) {
  try {
    if (!(modulos || []).includes('alertas_dia_d')) return;
    if (localStorage.getItem('franja_avisos_alertas_cerrada') === '1') return;
    const r = await api('/dia-d/alertas/mis-avisos');
    if (r.suscrito || r.avisos_activos === false) return;
    document.getElementById('franja-avisos-alertas').style.display = 'block';
  } catch (_) { /* sin la franja: no es crítico */ }
}
document.getElementById('cerrar-franja-avisos').addEventListener('click', () => {
  document.getElementById('franja-avisos-alertas').style.display = 'none';
  try { localStorage.setItem('franja_avisos_alertas_cerrada', '1'); } catch (_) { /* sin almacenamiento */ }
});

/* Interruptor de avisos. Se monta al final: si el navegador no los admite
   —o la campaña no tiene push configurado— el recuadro queda vacío y no
   se ve un control que no hace nada. */
(function(){
  const caja=document.createElement('div');
  caja.id='caja-avisos-push';
  caja.style.cssText='margin:14px 0; padding:12px; border:1px solid var(--linea,#e2ddd0); border-radius:10px; background:#fff;';
  const main=document.querySelector('main')||document.body;
  main.appendChild(caja);
  if (typeof montarAvisosPush==='function') montarAvisosPush(caja);
})();
</script>
</body>
</html>
