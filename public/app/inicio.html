function iniciales(nombre) {
  const partes = (nombre || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return partes.map(p => p[0].toUpperCase()).join('') || '—';
}

/** Quita un prefijo tipo "Candidato: " si alguien lo escribió dentro del campo de nombre en Configuración — solo afecta cómo se muestra acá, no el dato guardado. */
function limpiarNombreCandidato(nombre) {
  return (nombre || '').replace(/^\s*candidato\s*:\s*/i, '').trim();
}

/* Módulos que este usuario puede VER según Asignación de permisos

   la primera es Legislación. Si la consulta falla o tarda —sin señal—, queda
   en [] y las entradas con `modulo` simplemente no se pintan: Legislación
   necesita conexión de todos modos. Las entradas SIN `modulo` no cambian. */
async function modulosPermitidosApp() {
  try {
    const permisos = await Promise.race([
      api('/permisos/mios'),
      new Promise((_, rechazar) => setTimeout(() => rechazar(new Error('tarda')), 2500))
    ]);
    /* Activar complementos (parche 318): `complementos` es { clave: true|false }. Se guarda lo último que dijo el servidor para las pantallas que se usan
       sin señal (Faltantes). Sin respuesta, {}: las entradas de un complemento NO se pintan (falla cerrado). */
    const complementos = (permisos && permisos.complementos) || {};
    try { localStorage.setItem('complementos_conocidos', JSON.stringify(complementos)); } catch (e) { /* sin almacenamiento */ }
    return { modulos: (permisos && permisos.modulos) || [], complementos };
  } catch (err) {
    return { modulos: [], complementos: {} };
  }
}

const GRUPO_APP_SIN_LUGAR = 45;

/** Ordena las entradas ya filtradas y las parte en grupos. Un grupo vacío para este rol no existe: no deja línea doble ni al principio ni al final.
    Una misma entrada no sale dos veces (Orden 50): el coordinador que además es aspirante recibía «Ranking Día D» por su menú y por el del aspirante.
    Se considera repetida la que lleva el MISMO destino (href completo) Y el MISMO título que una anterior; se queda la primera según el orden de arriba.
    Dos entradas con el mismo destino pero otro título NO se juntan: son cosas distintas para quien las lee. */
function agruparMenuApp(items) {
  const conLugar = items.map((it, i) => {
    const lugar = ORDEN_MENU_APP[it.href];
    return { it, i, g: lugar ? lugar[0] : GRUPO_APP_SIN_LUGAR, o: lugar ? lugar[1] : 0 };
  });
  conLugar.sort((a, b) => (a.g - b.g) || (a.o - b.o) || (a.i - b.i));
  const vistas = new Set();
  const grupos = [];
  conLugar.forEach(x => {
    const clave = x.it.href + '\u0000' + x.it.titulo;
    if (vistas.has(clave)) return;
    vistas.add(clave);
    if (!grupos.length || grupos[grupos.length - 1].g !== x.g) grupos.push({ g: x.g, items: [] });
    grupos[grupos.length - 1].items.push(x.it);
  });
  return grupos;      // [{ g: número de grupo, items: [entradas] }]
}

/* El título de cada grupo del menú. Se agregaron con el rediseño del celular (hasta entonces los grupos solo iban
   separados por una línea): son nombres neutros, ajustables aquí sin tocar nada más. El 45 es el grupo de lo que no
   tiene lugar todavía. */
const TITULOS_GRUPO_APP = {
  0: 'Resumen', 1: 'Registro', 2: 'Trabajo de campo y solicitudes', 3: 'Eventos y Día D',
  4: 'Material de apoyo', 45: 'Más', 5: 'Mi cuenta y ayuda'
};
function tituloGrupoMenuApp(g) { return TITULOS_GRUPO_APP[g] || 'Más'; }

function tarjetaMenuApp(it) {
  return `
    <a class="menu-boton" href="${it.href}">
      <div class="icono" aria-hidden="true">${it.icono}</div>
      <div class="texto"><strong>${it.titulo}</strong><span>${it.subtitulo}</span></div>
      ${it.insigniaAvisos ? '<span id="insignia-avisos" class="insignia-menu" hidden></span>' : ''}
      <div class="flecha" aria-hidden="true">›</div>
    </a>`;
}

function pintarMenu(rol, modulosPermitidos, esAspirante, complementos) {
  const base = rol === 'admin' ? MENU_ADMIN : (rol === 'coordinador' ? MENU_COORDINADOR : MENU_LIDER);
  let prefiereEscritorio = false;
  try { prefiereEscritorio = localStorage.getItem('admin_preferir_escritorio') === '1'; } catch (e) { /* sin almacenamiento */ }
  const items = base.filter(it => (!it.complemento || (complementos || {})[it.complemento] === true)   // un complemento apagado no se pinta para NADIE
                              && (!it.modulo || (modulosPermitidos || []).includes(it.modulo))
                              && (!it.modulos || it.modulos.some(m => (modulosPermitidos || []).includes(m)))
                              && (!it.soloSiEscritorio || prefiereEscritorio)
                              && (!it.soloAspirante || esAspirante)
                              && (!it.soloAdminCandidato || window.__esAdminCandidato === true));
  document.getElementById('menu-app').innerHTML = agruparMenuApp(items)
    .map(grupo => `<section class="menu-grupo"><h2 class="menu-grupo-titulo">${tituloGrupoMenuApp(grupo.g)}</h2>`
      + `<div class="menu-grid">${grupo.items.map(tarjetaMenuApp).join('')}</div></section>`)
    .join('');
  pintarInsigniaAvisos();
}

/* La insignia «N nuevos» de Mis avisos. «Nuevo» = más reciente que lo último que se abrió EN ESTE CELULAR (localStorage): no hay «leído» en
   el servidor todavía (pediría una columna nueva). Solo cuenta los de los últimos 7 días. Si falla (sin señal), la insignia no se pinta. */
async function pintarInsigniaAvisos() {
  const el = document.getElementById('insignia-avisos');
  if (!el) return;
  try {
    let visto = 0;
    try { visto = parseInt(localStorage.getItem('avisos_ultimo_visto'), 10) || 0; } catch (_) { /* sin almacenamiento */ }
    const r = await api('/push/mis-avisos/contar?desde=' + visto);
    if (r && r.nuevos > 0) { el.textContent = r.nuevos > 9 ? '9+' : String(r.nuevos); el.hidden = false; }
  } catch (_) { /* sin señal: sin insignia */ }
}

function pintarCampana(campana, bio) {
  if (!campana || !campana.nombre_candidato) return; // sin datos configurados aún: se deja oculto

  const nombre = limpiarNombreCandidato(campana.nombre_candidato);
  document.getElementById('campana-nombre').textContent = nombre;

  const metaPartes = [CARGOS[campana.cargo_aspira], campana.ciudad].filter(Boolean);
  document.getElementById('campana-meta').textContent = metaPartes.join(' · ');

  if (campana.partido_politico) {
    const partidoEl = document.getElementById('campana-partido');
    partidoEl.textContent = campana.partido_politico;
    partidoEl.style.display = 'block';
  }

  if (campana.slogan_campana) {
    const sloganEl = document.getElementById('campana-slogan');
    sloganEl.textContent = `“${campana.slogan_campana}”`;
    sloganEl.style.display = 'block';
  }

  // Misma fuente y mismo criterio de respaldo que biografia.html: foto si
  // hay una guardada en Biografía del candidato, si no, iniciales.
  if (bio && bio.foto_url) {
    const img = document.getElementById('campana-foto');
    img.src = bio.foto_url;
    img.style.display = 'block';
  } else {
    document.getElementById('campana-iniciales').textContent = iniciales(nombre);
  }

  document.getElementById('campana-card').style.display = 'flex';
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;

  // Esta pantalla es el "start_url" fijo del manifest de la PWA — cuando
  // alguien la instala en el celular, el ícono SIEMPRE abre acá, sin
  // importar el rol de quien esté conectado en ese momento (el manifest
  // no puede ser distinto por rol). Un testigo nunca debe ver el menú de
  // líder/sublíder: se manda directo a su única pantalla de trabajo.
  if (usuario.rol === 'testigo') {
    window.location.replace('/app/dia-d.html');
    return;
  }
  // El candidato principal tiene su propia app (orden 73): el ícono de la app instalada abre ESTA pantalla (start_url fijo) y de aquí se le lleva a la suya, no al menú de líder.
  if (usuario.rol === 'candidato') {
    window.location.replace('/app/candidato.html');
    return;
  }
  /* ORDEN 81: el administrador que también es el candidato. El ícono de la app instalada abre ESTA pantalla (start_url fijo): si en este equipo el último modo fue el de
     candidato —o nunca eligió—, se le lleva a su app; si fue el de administrador, ve su menú de siempre (con «Modo candidato» arriba). */
  if (usuario.rol === 'admin' && Number(usuario.es_candidato)) {
    let modoAdmin = false;
    try { modoAdmin = localStorage.getItem('modo_admin_candidato') === 'admin'; } catch (e) { modoAdmin = false; }
    if (!modoAdmin) { window.location.replace('/app/candidato.html'); return; }
    window.__esAdminCandidato = true;
  }

  if (usuario.rol === 'coordinador') document.body.classList.add('inicio-coordinador');   // orden 68: el nuevo diseño de «Mi equipo» (solo el coordinador)
  pintarBarraApp('Estrategia', null, null);
  // Saludo pequeño y el nombre grande (textContent: el nombre es dato de la persona, nunca HTML).
  const saludo = document.getElementById('saludo');
  saludo.textContent = '';
  const hs = document.createElement('span'); hs.className = 'hero-saludo'; hs.textContent = 'Hola,';
  const hn = document.createElement('span'); hn.className = 'hero-nombre'; hn.textContent = usuario.nombre || '';
  saludo.append(hs, hn);
  const { modulos: modulosApp, complementos: complementosApp } = await modulosPermitidosApp();
  pintarMenu(usuario.rol, modulosApp, !!usuario.es_aspirante, complementosApp);
  mostrarFranjaDeAvisos(modulosApp, complementosApp);
  // El panel del líder va arriba del menú. Quien no es líder ni sublíder (ni aspirante, que entra con rol líder) no lo pide.
  if (['lider', 'sublider'].includes(usuario.rol) && window.PanelLider) {
    document.body.classList.add('inicio-con-cifras');      // el hero deja sitio a la tarjeta de cifras que sube sobre él
    window.PanelLider.iniciar(usuario);
  }

  // El coordinador: las cifras de su rama arriba del menú (misma tarjeta que el panel del líder, que no pide).
  if (usuario.rol === 'coordinador' && window.PanelCoordinador) {
    document.body.classList.add('inicio-con-cifras');
    window.PanelCoordinador.iniciar(usuario);
  }

  try {
    const [campana, bio] = await Promise.all([
      api('/configuracion/campana'),
      api('/contenido/biografia_candidato').catch(() => ({}))
    ]);
    pintarCampana(campana, bio);
  } catch (err) {
    // Si falla la consulta, simplemente no se muestra la tarjeta — el resto de la pantalla sigue funcionando igual.
  }
})();

document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
  // Parche 329: se cierra AL INSTANTE en este celular (cuenta, identidad en caché, copias de lectura) y al servidor se le avisa como «mejor
  // esfuerzo»: sin señal queda `logout_pendiente` y se cierra al volver. La cuenta NO se «olvida»: sigue en el selector de /login.html.
  await cerrarSesionLocal();
});

/* La franja «Activa los avisos». Sólo si la persona tiene el módulo de alertas y NINGÚN dispositivo suscrito; la ruta
   /dia-d/alertas/mis-avisos responde 403 a quien no tiene el módulo, y entonces no se ofrece. Se puede cerrar. */
async function mostrarFranjaDeAvisos(modulos, complementos) {
  try {
    if ((complementos || {}).alertas_dia_d !== true) return;          // Activar complementos (parche 318): sin Alertas encendido no se ofrece
    if (!(modulos || []).includes('alertas_dia_d')) return;
    if (localStorage.getItem('franja_avisos_alertas_cerrada') === '1') return;
    const r = await api('/dia-d/alertas/mis-avisos');
    if (r.suscrito || r.avisos_activos === false) return;
    document.getElementById('franja-avisos-alertas').style.display = 'block';
  } catch (_) { /* sin la franja: no es crítico */ }
}
document.getElementById('cerrar-franja-avisos').addEventListener('click', () => {
  document.getElementById('franja-avisos-alertas').style.display = 'none';
  try { localStorage.setItem('franja_avisos_alertas_cerrada', '1'); } catch (_) { /* sin almacenamiento */ }
});

/* Interruptor de avisos. Se monta al final: si el navegador no los admite
   —o la campaña no tiene push configurado— el recuadro queda vacío y no
   se ve un control que no hace nada. */
(function(){
  const caja=document.createElement('div');
  caja.id='caja-avisos-push';
  caja.style.cssText='margin:14px 0; padding:14px; border-radius:var(--radio); box-shadow:var(--sombra); background:#fff;';
  const main=document.querySelector('main')||document.body;
  main.appendChild(caja);
  if (typeof montarAvisosPush==='function') montarAvisosPush(caja);
})();
</script>
