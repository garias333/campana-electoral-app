<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142a3f">
<title>Información para compartir · Estrategia</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estrategia">
<link rel="stylesheet" href="/app/estilos-app.css">
<style>
  .filtros-app { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; overflow-x: auto; padding-bottom: 2px; }
  .rec-tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .rec-tarjeta img { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; }
  .rec-tarjeta video { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; background: #000; }
  .rec-tarjeta audio { width: 100%; margin-bottom: 10px; }
  .rec-tarjeta h3 { margin: 0 0 4px; font-size: 1rem; color: var(--navy); }
  .rec-tipo { display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--copper); font-weight: 700; margin-bottom: 8px; }
  .rec-tarjeta p { margin: 0 0 12px; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
  .rec-meta { font-size: 0.76rem; color: var(--muted); margin: -6px 0 12px; }
  .rec-tarjeta a.btn-app { text-decoration: none; }
  /* Vista previa que se carga con fetch + token: mientras no llega, un recuadro del tamaño de una miniatura. */
  .rec-vista { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; margin-bottom: 10px; background: var(--cream); border: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; font-family: inherit; color: var(--navy); font-weight: 600; font-size: .86rem; cursor: pointer; overflow: hidden; padding: 0; }
  .rec-vista .ico { font-size: 2rem; }
  .rec-vista img { width: 100%; height: 100%; object-fit: cover; display: block; margin: 0; border-radius: 0; }
  .vacio-app { text-align: center; color: var(--muted); padding: 50px 20px; }
</style>
</head>
<body>
<div class="app-barra" id="app-barra"></div>
<main class="app-cuerpo">
  <div id="pantalla-carga" class="pantalla-carga">Cargando…</div>
  <div id="contenedor" style="display:none;">
    <div class="filtros-app" id="filtros-app"></div>
    <div id="lista-recursos"></div>
    <div id="vacio" class="vacio-app" style="display:none;">
      <div style="font-size:2.2rem; margin-bottom:10px;">📭</div>
      Todavía no hay contenido publicado en esta categoría.
    </div>
  </div>
  <div id="error-carga" class="aviso-app error" style="display:none;"></div>
</main>

<script src="/js/api-core.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/app/app-comun.js"></script>
<script>
// "Publicidad descargable" e "Información para compartir" muestran el
// mismo listado de /recursos (según se definió) — cada tarjeta ya trae
// su propia etiqueta de Tipo, y además se puede filtrar por tipo con
// los chips de arriba, igual que en la versión de escritorio.
const params = new URLSearchParams(window.location.search);
const modo = params.get('modo') === 'publicidad' ? 'publicidad' : 'informacion';

// Mismos tipos y mismo orden que ya usa recursos.html en escritorio —
// deben coincidir exactamente con los valores reales que guarda
// routes/recursos.routes.js, no son etiquetas libres.
const TIPOS = [
  { clave: '', etiqueta: 'Todos', icono: '▣' },
  { clave: 'noticia', etiqueta: 'Noticias', icono: '📰' },
  { clave: 'post_redes', etiqueta: 'Post para redes', icono: '📣' },
  { clave: 'video', etiqueta: 'Videos', icono: '🎬' },
  { clave: 'publicidad_digital', etiqueta: 'Publicidad digital', icono: '🖥️' },
  { clave: 'publicidad_impresa', etiqueta: 'Publicidad impresa', icono: '🖨️' },
  { clave: 'proxima_reunion', etiqueta: 'Próximas reuniones', icono: '📅' },
  { clave: 'jingle', etiqueta: 'Jingles', icono: '🎵' },
  { clave: 'foto_campana', etiqueta: 'Fotos de la campaña', icono: '📷' }
];
const ETIQUETAS_TIPO = Object.fromEntries(TIPOS.filter(t => t.clave).map(t => [t.clave, t.etiqueta]));
const ICONOS_TIPO = Object.fromEntries(TIPOS.filter(t => t.clave).map(t => [t.clave, t.icono]));

let itemsCache = [];
let filtroActual = '';

function formatoTamano(kb) {
  if (!kb) return '';
  return kb >= 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${kb} KB`;
}

function pintarFiltros() {
  document.getElementById('filtros-app').innerHTML = TIPOS.map(t => `
    <div class="chip-app ${filtroActual === t.clave ? 'activo' : ''}" style="flex:0 0 auto; white-space:nowrap;" onclick="elegirFiltro('${t.clave}')">
      ${t.icono} ${t.etiqueta}
    </div>
  `).join('');
}

function elegirFiltro(clave) {
  filtroActual = clave;
  pintarFiltros();
  pintarLista();
}

function pintarLista() {
  liberarVistas();
  const items = filtroActual ? itemsCache.filter(r => r.tipo === filtroActual) : itemsCache;
  document.getElementById('vacio').style.display = items.length ? 'none' : 'block';

  document.getElementById('lista-recursos').innerHTML = items.map((r) => {
    const esImagen = r.archivo_mime && r.archivo_mime.startsWith('image/');
    const esVideo = r.archivo_mime && r.archivo_mime.startsWith('video/');
    const esAudio = r.archivo_mime && r.archivo_mime.startsWith('audio/');
    const etiquetaTipo = ETIQUETAS_TIPO[r.tipo] || r.tipo || '';
    const iconoTipo = ICONOS_TIPO[r.tipo] || '';
    const detalles = [
      r.archivo_tamano_kb ? formatoTamano(r.archivo_tamano_kb) : '',
      r.fecha_evento ? new Date(r.fecha_evento).toLocaleDateString('es-CO') : ''
    ].filter(Boolean).join(' · ');

    /* DESCARGA Y VISTAS PREVIAS CON fetch + X-Device-Token (ver pedirArchivoApp en app-comun.js).
       Antes: <a href="/recursos/:id/descargar"> — sin /api (esa ruta no existe) y sin token, porque un
       enlace solo lleva la cookie de 8 horas. Y <img src="/uploads/…"> tenía el mismo límite. */
    let boton = '';
    if (r.archivo_url) {
      boton = `<button type="button" class="btn-app btn-app-primario" data-descargar="${r.id}">Descargar</button>`;
    } else if (r.enlace_externo) {
      boton = `<a class="btn-app btn-app-primario" href="${escaparAppHtml(r.enlace_externo)}" target="_blank" rel="noopener">Abrir enlace</a>`;
    }

    let vista = '';
    /* Una imagen de más de 8 MB no se baja sola para la miniatura (el celular puede estar con datos): se toca para verla. */
    const imagenPesada = esImagen && (r.archivo_tamano_kb || 0) > 8 * 1024;
    if (esImagen) vista = `<button type="button" class="rec-vista" data-vista="imagen" data-id="${r.id}"${imagenPesada ? ' data-pesada="1"' : ''} aria-label="Ver imagen"><span class="ico">🖼️</span>${imagenPesada ? 'Tocar para ver (' + formatoTamano(r.archivo_tamano_kb) + ')' : ''}</button>`;
    else if (esVideo) vista = `<button type="button" class="rec-vista" data-vista="video" data-id="${r.id}"><span class="ico">🎬</span>Tocar para ver el video</button>`;
    else if (esAudio) vista = `<button type="button" class="rec-vista" data-vista="audio" data-id="${r.id}"><span class="ico">🎵</span>Tocar para escuchar</button>`;

    return `
      <div class="rec-tarjeta">
        ${vista}
        ${etiquetaTipo ? `<span class="rec-tipo">${iconoTipo} ${escaparAppHtml(etiquetaTipo)}</span>` : ''}
        <h3>${escaparAppHtml(r.titulo)}</h3>
        ${detalles ? `<p class="rec-meta">${escaparAppHtml(detalles)}</p>` : ''}
        ${r.descripcion ? `<p>${escaparAppHtml(r.descripcion)}</p>` : ''}
        ${boton}
      </div>
    `;
  }).join('');
  activarVistas();
}

/* ---- Vistas previas y descarga con token ---- */
const urlsVista = [];                       // URLs de objeto vivas: se liberan al re-pintar y al salir
function liberarVistas() { while (urlsVista.length) URL.revokeObjectURL(urlsVista.pop()); }
window.addEventListener('pagehide', liberarVistas);

async function cargarVista(boton) {
  const id = boton.dataset.id;
  const tipo = boton.dataset.vista;
  if (boton.dataset.cargando === '1') return;
  boton.dataset.cargando = '1';
  const textoAntes = boton.innerHTML;
  if (tipo !== 'imagen') boton.textContent = 'Cargando…';
  try {
    const got = await pedirArchivoApp(`/recursos/${id}/descargar`);
    if (!got || !document.body.contains(boton)) return;
    const url = URL.createObjectURL(got.blob);
    urlsVista.push(url);
    let el;
    if (tipo === 'imagen') { el = document.createElement('img'); el.alt = ''; }
    else { el = document.createElement(tipo); el.controls = true; if (tipo === 'video') el.setAttribute('playsinline', ''); el.preload = 'metadata'; }
    el.src = url;
    if (tipo === 'imagen') { boton.innerHTML = ''; boton.appendChild(el); boton.dataset.vista = 'lista'; }
    else { boton.replaceWith(el); el.style.cssText = 'width:100%; border-radius:10px; margin-bottom:10px; display:block;'; }
  } catch (err) {
    boton.innerHTML = textoAntes;
    boton.dataset.cargando = '';
  }
}

/* Las imágenes se piden al entrar en pantalla, no todas de golpe. */
const observadorVistas = ('IntersectionObserver' in window) ? new IntersectionObserver((entradas) => {
  entradas.forEach(en => {
    if (!en.isIntersecting) return;
    observadorVistas.unobserve(en.target);
    cargarVista(en.target);
  });
}, { rootMargin: '200px 0px' }) : null;

function activarVistas() {
  document.querySelectorAll('.rec-vista[data-vista="imagen"]:not([data-pesada])').forEach(b => {
    if (observadorVistas) observadorVistas.observe(b); else cargarVista(b);
  });
}

document.getElementById('lista-recursos').addEventListener('click', async (e) => {
  const v = e.target.closest('.rec-vista');
  if (v && v.dataset.vista !== 'lista') { cargarVista(v); return; }
  const d = e.target.closest('[data-descargar]');
  if (!d) return;
  const r = itemsCache.find(x => String(x.id) === d.dataset.descargar);
  const antes = d.textContent;
  d.disabled = true; d.textContent = 'Descargando…';
  try {
    const got = await pedirArchivoApp(`/recursos/${d.dataset.descargar}/descargar`);
    if (!got) return;
    guardarBlobApp(got.blob, (r && r.archivo_nombre) || got.nombre || 'archivo');
  } catch (err) {
    alert(err.esErrorDeRed ? 'Sin conexión: no se pudo descargar el archivo.' : (err.message || 'No se pudo descargar el archivo.'));
  } finally {
    d.disabled = false; d.textContent = antes;
  }
});

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp(
    modo === 'publicidad' ? 'Publicidad descargable' : 'Información para compartir',
    null, '/app/inicio.html'
  );

  try {
    const items = await api('/recursos');
    itemsCache = Array.isArray(items) ? items : [];
    document.getElementById('pantalla-carga').style.display = 'none';
    document.getElementById('contenedor').style.display = 'block';
    pintarFiltros();
    pintarLista();
  } catch (err) {
    document.getElementById('pantalla-carga').style.display = 'none';
    const box = document.getElementById('error-carga');
    box.textContent = 'No se pudo cargar el contenido en este momento. Intenta de nuevo más tarde.';
    box.classList.add('visible');
  }
})();
</script>
</body>
</html>
