<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142a3f">
<title>Biografía del candidato · Estrategia</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="stylesheet" href="/app/estilos-app.css">
<style>
  .bio-foto { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 3px solid var(--copper); display: block; margin: 8px auto 18px; }
  .bio-iniciales { width: 132px; height: 132px; border-radius: 50%; background: var(--navy); color: var(--copper); font-size: 3rem; font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; margin: 8px auto 18px; }
  .bio-nombre { text-align: center; font-size: 1.4rem; font-weight: 700; color: var(--navy); margin: 0 0 20px; }
  .bio-texto { font-size: 0.98rem; line-height: 1.7; white-space: pre-wrap; }
  .bio-video { width: 100%; border-radius: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="app-barra" id="app-barra"></div>
<main class="app-cuerpo">
  <div id="pantalla-carga" class="pantalla-carga">Cargando…</div>
  <div id="contenido" style="display:none;">
    <img id="bio-foto" class="bio-foto" style="display:none;">
    <div id="bio-iniciales" class="bio-iniciales" style="display:none;"></div>
    <h1 class="bio-nombre" id="bio-nombre"></h1>
    <div class="bio-texto" id="bio-texto"></div>
    <video id="bio-video" class="bio-video" controls style="display:none;"></video>
  </div>
</main>

<script src="/js/api-core.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/app/app-comun.js"></script>
<script>
(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp('Biografía del candidato', null, '/app/inicio.html');

  const [c, config] = await Promise.all([
    api('/contenido/biografia_candidato'),
    api('/configuracion/campana').catch(() => ({}))
  ]);

  const nombre = (config.nombre_candidato || '').trim() || c.titulo || 'Biografía del candidato';
  document.getElementById('bio-nombre').textContent = nombre;

  if (c.foto_url) {
    const img = document.getElementById('bio-foto');
    img.src = c.foto_url;
    img.style.display = 'block';
  } else {
    const iniciales = document.getElementById('bio-iniciales');
    iniciales.textContent = nombre.trim().charAt(0).toUpperCase();
    iniciales.style.display = 'flex';
  }

  document.getElementById('bio-texto').textContent = c.contenido && c.contenido.trim()
    ? c.contenido
    : 'Todavía no se ha escrito la biografía.';

  if (c.video_url) {
    const video = document.getElementById('bio-video');
    video.src = c.video_url;
    video.style.display = 'block';
  }

  document.getElementById('pantalla-carga').style.display = 'none';
  document.getElementById('contenido').style.display = 'block';
})();
</script>
</body>
</html>
