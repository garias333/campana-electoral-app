<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5ED7">
<title>Mis tareas · Estrategia</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estrategia">
<link rel="stylesheet" href="/app/estilos-app.css">
<style>
  /* TAREAS, «Mis tareas» (parche 305): lo que tengo asignado, lo que sigue en el celular sin subir y lo que ya está hecho. */
  .grupo-titulo { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--marca-azul); margin: 18px 0 8px; }
  .caja-tar { background: #fff; border-radius: var(--radio); box-shadow: var(--sombra); padding: 14px; margin-bottom: 12px; }
  .caja-tar.abierta { box-shadow: 0 0 0 2px var(--marca-azul), var(--sombra); }
  .caja-tar .arriba { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; cursor: pointer; }
  .caja-tar .nombre { font-weight: 700; color: var(--navy); overflow-wrap: anywhere; }
  .caja-tar .meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .caja-tar .detalle { margin-top: 10px; border-top: 1px solid var(--linea); padding-top: 10px; font-size: 0.9rem; line-height: 1.4; }
  .etiqueta { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--campo); color: var(--texto-2); white-space: nowrap; border: 0; margin-left: 4px; }
  .etiqueta.roja { background: var(--error-fondo); color: var(--error); }
  .etiqueta.ambar { background: var(--aviso-fondo); color: var(--aviso); }
  .etiqueta.verde { background: var(--ok-fondo); color: var(--ok); }
  .nota-tar { background: var(--aviso-fondo); border: 1px solid var(--marca-amarillo); border-radius: 14px; padding: 8px 10px; margin: 8px 0; font-size: 0.86rem; }
  .acciones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones .btn-app { flex: 1 1 120px; }
  /* Los campos del formulario son .campo-app (estilos-app.css). Guardar / Cancelar van en la BARRA FIJA de abajo, como en el
     registro de votante: con el formulario abierto siempre están a la vista y suben con el teclado (--teclado). */
  .form-tar { margin-top: 10px; }
  .form-tar .acciones {
    position: fixed; left: 0; right: 0; bottom: var(--teclado, 0px); z-index: 30; margin: 0; flex-wrap: nowrap;
    background: var(--fondo); padding: 10px max(14px, calc((100% - 532px) / 2)) calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .form-tar .acciones .btn-app { flex: 1 1 0; min-width: 0; }
  .form-tar > label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  .fotos-tar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .fotos-tar .foto { position: relative; width: 84px; height: 84px; }
  .fotos-tar img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--linea); }
  .fotos-tar button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #142a3f; color: #fff; }
  .resumen-tar { display: flex; gap: 8px; margin: 10px 0 0; }
  .resumen-tar div { flex: 1; background: #fff; border: 0; box-shadow: var(--sombra); border-radius: 16px; padding: 8px; text-align: center; }
  .resumen-tar b { display: block; font-size: 1.2rem; color: var(--navy); }
  .resumen-tar span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>

<div class="app-barra" id="app-barra"></div>

<main class="app-cuerpo">
  <div id="aviso" class="aviso-app"></div>
  <div class="resumen-tar" id="resumen" style="display:none;"></div>

  <div id="bloque-pendientes" style="display:none;">
    <p class="grupo-titulo">En este celular, sin subir</p>
    <div id="lista-pendientes"></div>
  </div>

  <div id="lista-servidor"><p class="vacio-app">Cargando…</p></div>
  <p id="nota-copia" class="meta" style="display:none; font-size:0.78rem; color:var(--muted);"></p>
</main>

<input type="file" id="archivo-foto" accept="image/*" capture="environment" style="display:none;">

<script src="/js/api-core.js"></script>
<script src="/js/form-utils.js"></script>
<script src="/js/offline-utils.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/app/app-comun.js"></script>
<script>
const STORE = 'tareas_pendientes';
const MAX_FOTOS = 3;
const $ = (id) => document.getElementById(id);
const esc = (t) => escaparAppHtml(t);
const ESTADO = { pendiente: 'Pendiente', en_curso: 'En curso', hecha: 'Hecha', verificada: 'Verificada', cancelada: 'Cancelada' };
const ACCION_TXT = { empece: 'Empecé', termine: 'Terminé', no_pude: 'No pude' };

let tareas = [];            // lo último que dijo el servidor (o la copia)
let abierta = null;         // id de la tarea desplegada
let edicion = null;         // { tareaId, accion, fotos: [{blob,url}], ubicacion }
let cola = [];
let sinAcceso = false;      // el servidor dijo 403: este tipo de usuario no tiene habilitadas las tareas

function fecha(v) {
  if (!v) return '';
  const d = new Date(String(v).slice(0, 10) + 'T12:00:00');
  return isNaN(d) ? String(v).slice(0, 10) : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
}
/* Los avisos generales van en el aviso flotante (app-comun.js), que se ve aunque el formulario esté abajo; los de un campo van
   debajo del campo (mostrarErrorCampo). El recuadro de arriba ya no se usa. */
function aviso(texto, tipo) {
  const a = $('aviso');
  a.className = 'aviso-app';
  if (texto) mostrarToast(texto, tipo === 'exito' ? 'ok' : 'error');
}

/* ----- la cola: cada acción se guarda primero en el celular, con su identificador, y después se intenta subir ----- */
function construirFormData(registro) {
  const p = registro.payload || {};
  const fd = new FormData();
  fd.append('tarea_id', registro.tareaId); fd.append('accion', registro.accion); fd.append('cliente_uuid', registro.clienteUuid);
  Object.keys(p).forEach((k) => { if (p[k] !== null && p[k] !== undefined && p[k] !== '') fd.append(k, p[k]); });
  (registro.fotos || []).forEach((b, i) => fd.append('fotos', b, `foto${i + 1}.jpg`));
  return fd;
}
async function leerCola() { try { cola = await listarColaOffline(STORE); } catch (_) { cola = []; } return cola; }

async function subirCola() {
  const antes = (await leerCola()).filter((r) => r.estado !== 'fallido').length;
  if (!antes) return;
  try { await sincronizarCola(STORE, '/tareas/accion', construirFormData); } catch (_) { /* sin señal */ }
}

/* ----- el dibujo ----- */
function etiquetas(t) {
  const e = [];
  if (t.sin_responsable_activo) e.push('<span class="etiqueta roja">Sin responsable activo</span>');
  if (t.vencida) e.push('<span class="etiqueta roja">Vencida</span>');
  else if (t.vence_hoy) e.push('<span class="etiqueta ambar">Vence hoy</span>');
  if (t.devuelta) e.push('<span class="etiqueta ambar">Devuelta</span>');
  if (t.no_pudo) e.push('<span class="etiqueta ambar">No pude</span>');
  e.push(`<span class="etiqueta ${t.estado === 'verificada' ? 'verde' : ''}">${esc(ESTADO[t.estado] || t.estado)}</span>`);
  return e.join('');
}

function avanceHtml(t) {
  const a = t.avance;
  if (!a) return t.tipo === 'reunion' ? '<div class="meta">El avance de la reunión no se muestra: no puedes ver ese evento.</div>' : '';
  if (a.actual === null || a.actual === undefined) return '<div class="meta">Sin medir: tu cuenta no está activa.</div>';
  const lleno = a.meta > 0 && a.actual >= a.meta;
  const texto = t.tipo === 'reunion' ? `Asistieron ${esc(a.actual)} de ${esc(a.meta)} (${esc(a.pct)} %)${a.evento ? ' · ' + esc(a.evento.titulo) : ''}`
    : `Llevas ${esc(a.actual)} de ${esc(a.meta)} registros (${esc(a.pct)} %)`;
  return `<div style="margin:8px 0"><div style="background:#EEF0F3;border-radius:6px;height:10px;overflow:hidden"><div style="height:100%;width:${Math.min(100, a.pct || 0)}%;background:${lleno ? '#1e7b4f' : '#4A78C2'}"></div></div><div class="meta">${texto}</div>
    ${t.tipo === 'meta_registros' ? '<div class="meta">Se cumple sola cuando llegas a la meta. No cuentan las personas que se anotaron por tu enlace y aún no confirman.</div>' : ''}</div>`;
}

function formularioTermine(t) {
  const conFoto = t.tipo !== 'libre' ? 'Foto' : 'Foto (opcional)';
  const pistas = { visita: 'Para terminar una visita hace falta una foto o la ubicación.', entrega: 'Para terminar una entrega hace falta la cantidad entregada y una foto.', libre: 'Puedes dejar una nota, fotos o la ubicación si quieres.' };
  return `<div class="form-tar" id="form-tar">
    <p class="meta">${esc(pistas[t.tipo] || '')}</p>
    ${t.tipo === 'entrega' ? `<div class="campo-app"><label for="f-cantidad">Cantidad entregada${t.cantidad_prevista ? ` (se esperaban ${esc(t.cantidad_prevista)})` : ''}</label><input type="number" id="f-cantidad" min="1" inputmode="numeric"></div>` : ''}
    <label>${conFoto}</label>
    <div class="fotos-tar" id="fotos-tar"></div>
    <button type="button" class="btn-app btn-app-secundario" id="btn-foto">📷 Agregar una foto</button>
    ${t.tipo !== 'entrega' ? `<button type="button" class="btn-app btn-app-secundario" id="btn-ubicacion" style="margin-top:8px;">📍 Usar mi ubicación</button><p class="meta" id="estado-ubicacion"></p>` : ''}
    <div class="campo-app"><label for="f-nota">Nota (opcional)</label><textarea id="f-nota" rows="2" maxlength="500"></textarea></div>
    <div class="acciones"><button type="button" class="btn-app btn-app-primario" id="btn-guardar-termine">Guardar</button><button type="button" class="btn-app btn-app-secundario" id="btn-cancelar-form">Cancelar</button></div>
  </div>`;
}
function formularioNoPude() {
  return `<div class="form-tar" id="form-tar"><div class="campo-app"><label for="f-nota">¿Por qué no pudiste?</label><textarea id="f-nota" rows="3" maxlength="255"></textarea></div>
    <div class="acciones"><button type="button" class="btn-app btn-app-primario" id="btn-guardar-nopude">Guardar</button><button type="button" class="btn-app btn-app-secundario" id="btn-cancelar-form">Cancelar</button></div></div>`;
}

function cajaDe(t) {
  const enCola = cola.filter((r) => String(r.tareaId) === String(t.id));
  const abiertaEsta = abierta === t.id;
  const puedeActuar = ['pendiente', 'en_curso'].includes(t.estado) && !enCola.length && !(edicion && edicion.tareaId === t.id);
  let detalle = '';
  if (abiertaEsta) {
    detalle = `<div class="detalle">
      ${t.descripcion ? `<div style="white-space:pre-wrap;">${esc(t.descripcion)}</div>` : '<div class="meta">Sin más detalle.</div>'}
      ${t.cantidad_prevista ? `<div class="meta">Cantidad prevista: ${esc(t.cantidad_prevista)}</div>` : ''}
      ${avanceHtml(t)}
      ${t.por_reasignar ? '<div class="nota-tar">Esta tarea está por reasignarse: quien te la asignó la va a revisar.</div>' : ''}
      ${t.devuelta_nota ? `<div class="nota-tar"><b>Te la devolvieron:</b> ${esc(t.devuelta_nota)}</div>` : ''}
      ${t.no_pudo_nota ? `<div class="nota-tar"><b>Tu último «no pude»:</b> ${esc(t.no_pudo_nota)}</div>` : ''}
      ${t.motivo_cancelacion ? `<div class="nota-tar"><b>Cancelada:</b> ${esc(t.motivo_cancelacion)}</div>` : ''}
      ${t.estado === 'hecha' && t.requiere_verificacion !== false ? '<div class="meta">Ya la terminaste. Está esperando que quien te la asignó la verifique.</div>' : ''}
      ${t.estado === 'hecha' && t.requiere_verificacion === false ? '<div class="meta">Llegaste a la meta: la tarea quedó cumplida.</div>' : ''}
      ${enCola.length ? '<div class="meta">Tiene un cambio en este celular que todavía no se sube.</div>' : ''}
      ${edicion && edicion.tareaId === t.id ? (edicion.accion === 'termine' ? formularioTermine(t) : formularioNoPude()) : ''}
      ${puedeActuar ? `<div class="acciones">
        ${t.estado === 'pendiente' ? `<button type="button" class="btn-app btn-app-secundario" data-accion="empece" data-id="${esc(t.id)}">Empecé</button>` : ''}
        ${t.requiere_verificacion === false ? '' : `<button type="button" class="btn-app btn-app-primario" data-accion="termine" data-id="${esc(t.id)}">Terminé</button>`}
        <button type="button" class="btn-app btn-app-secundario" data-accion="no_pude" data-id="${esc(t.id)}">No pude</button></div>` : ''}
    </div>`;
  }
  return `<div class="caja-tar ${abiertaEsta ? 'abierta' : ''}" data-tarea="${esc(t.id)}">
    <div class="arriba" data-abrir="${esc(t.id)}"><span class="nombre">${esc(t.titulo)}</span><span style="text-align:right;">${etiquetas(t)}</span></div>
    <div class="meta">${esc(t.tipo_etiqueta)}${t.zona ? ' · ' + esc(t.zona) : ''}${t.fecha_limite ? ' · Para el ' + esc(fecha(t.fecha_limite)) : ''}${t.creador ? ' · Te la asignó ' + esc(t.creador) : ''}</div>
    ${detalle}</div>`;
}

function pintarPendientes() {
  $('bloque-pendientes').style.display = cola.length ? 'block' : 'none';
  $('lista-pendientes').innerHTML = cola.slice().sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0)).map((r) => {
    const fallida = r.estado === 'fallido';
    return `<div class="caja-tar"><div class="arriba"><span class="nombre">${esc(r.tareaTitulo || 'Tarea')}</span>
      <span class="etiqueta ${fallida ? 'roja' : 'ambar'}">${fallida ? 'No se pudo subir' : 'Esperando señal'}</span></div>
      <div class="meta">${esc(ACCION_TXT[r.accion] || r.accion)} · ${(r.fotos || []).length} foto(s)</div>
      ${fallida ? `<div class="meta" style="color:var(--error); margin-top:6px;" data-error>${esc(r.error || '')}</div><div class="acciones"><button type="button" class="btn-app btn-app-primario" data-reintentar="${esc(r.clienteUuid)}">Reintentar</button>
        <button type="button" class="btn-app btn-app-secundario" data-descartar="${esc(r.clienteUuid)}">Descartar</button></div>` : ''}</div>`;
  }).join('');
  // «Reintentar» (parche 308): un rechazo puede ser un corte del servidor y no un error de lo que se hizo. Vuelve a ponerlo en espera y lo sube
  // otra vez; si el servidor lo rechaza de nuevo, queda aquí con su motivo. Nada se borra solo.
  $('lista-pendientes').querySelectorAll('[data-reintentar]').forEach((b) => b.addEventListener('click', async () => {
    const r = cola.find((x) => x.clienteUuid === b.dataset.reintentar);
    if (!r) return;
    delete r.estado; delete r.error;
    await guardarEnColaOffline(STORE, r);
    await subirCola();
    await refrescar(false);
  }));
  $('lista-pendientes').querySelectorAll('[data-descartar]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('¿Descartar este cambio? No se subirá.')) return;
    await borrarDeColaOffline(STORE, b.dataset.descartar);
    await refrescar(false);
  }));
}

function pintar() {
  pintarPendientes();
  if (sinAcceso) {
    $('resumen').style.display = 'none';
    $('lista-servidor').innerHTML = '<p class="vacio-app">Tu tipo de usuario no tiene habilitadas las tareas. Pídeselo al administrador de la campaña.</p>';
    return;
  }
  const grupos = [
    ['Para hacer', tareas.filter((t) => ['pendiente', 'en_curso'].includes(t.estado))],
    ['Esperando verificación', tareas.filter((t) => t.estado === 'hecha' && t.requiere_verificacion !== false)],
    ['Cerradas y cumplidas', tareas.filter((t) => ['verificada', 'cancelada'].includes(t.estado) || (t.estado === 'hecha' && t.requiere_verificacion === false))],
  ];
  const html = grupos.filter((g) => g[1].length).map((g) => `<p class="grupo-titulo">${g[0]}</p>${g[1].map(cajaDe).join('')}`).join('');
  $('lista-servidor').innerHTML = html || '<p class="vacio-app">No tienes tareas asignadas.</p>';
  const L = $('lista-servidor');
  L.querySelectorAll('[data-abrir]').forEach((el) => el.addEventListener('click', () => { abierta = abierta === Number(el.dataset.abrir) ? null : Number(el.dataset.abrir); if (edicion && edicion.tareaId !== abierta) liberarEdicion(); pintar(); }));
  L.querySelectorAll('[data-accion]').forEach((b) => b.addEventListener('click', () => accionar(Number(b.dataset.id), b.dataset.accion)));
  const t = edicion && tareas.find((x) => x.id === edicion.tareaId);
  document.body.classList.toggle('con-barra-fija', !!edicion);      // con el formulario abierto hay barra fija: deja sitio abajo
  if (edicion) {
    pintarFotosForm();
    const bf = $('btn-foto'); if (bf) bf.addEventListener('click', () => $('archivo-foto').click());
    const bu = $('btn-ubicacion'); if (bu) bu.addEventListener('click', tomarUbicacion);
    const bc = $('btn-cancelar-form'); if (bc) bc.addEventListener('click', () => { liberarEdicion(); pintar(); });
    const bg = $('btn-guardar-termine'); if (bg) bg.addEventListener('click', () => guardarTermine(t));
    const bn = $('btn-guardar-nopude'); if (bn) bn.addEventListener('click', () => guardarNoPude(t));
    if (edicion.ubicacion) mostrarUbicacion();
  }
}

/* ----- empecé / terminé / no pude ----- */
async function encolar(t, accion, payload, fotosBlob) {
  const registro = { clienteUuid: generarUuid(), creadoEn: Date.now(), tareaId: t.id, tareaTitulo: t.titulo, accion, payload: Object.assign({ marcado_en: new Date().toISOString() }, payload || {}), fotos: fotosBlob || [] };
  try { await guardarEnColaOffline(STORE, registro); }                    // lo primero: que no se pierda aunque se cierre la app
  catch (e) { aviso('No se pudo guardar en este celular. Revisa el espacio disponible e inténtalo de nuevo.'); return false; }
  liberarEdicion();
  await subirCola();
  await refrescar(true);
  const resto = (await leerCola()).find((r) => r.clienteUuid === registro.clienteUuid);
  // Un rechazo del servidor NO se borra (parche 308): queda «fallido» en «En este celular, sin subir», con su motivo, Reintentar y Descartar.
  if (resto && resto.estado === 'fallido') { aviso(`${resto.error || 'No se pudo registrar.'} Quedó guardado en este celular: puedes reintentarlo o descartarlo.`); await refrescar(false); return false; }
  aviso(resto ? 'Guardado en tu celular. Se sube solo cuando haya señal.' : 'Listo.', 'exito');
  return true;
}

function accionar(id, accion) {
  const t = tareas.find((x) => x.id === id);
  if (!t) return;
  aviso('');
  if (accion === 'empece') return encolar(t, 'empece');
  liberarEdicion();
  edicion = { tareaId: id, accion, fotos: [], ubicacion: null };
  abierta = id;
  pintar();
}
async function guardarNoPude(t) {
  const nota = $('f-nota').value.trim();
  limpiarErrores($('form-tar'));
  if (nota.length < 3) return mostrarErrorCampo($('f-nota'), 'Cuenta por qué no pudiste (al menos 3 letras).');
  await encolar(t, 'no_pude', { nota });
}
async function guardarTermine(t) {
  const nota = $('f-nota').value.trim();
  const cantidad = $('f-cantidad') ? Number($('f-cantidad').value) : '';
  const hayFoto = edicion.fotos.length > 0;
  const previas = t.fotos || 0;
  limpiarErrores($('form-tar'));
  if (t.tipo === 'visita' && !hayFoto && !previas && !edicion.ubicacion) return mostrarErrorCampo($('btn-foto'), 'Una visita se termina con una foto o con la ubicación.');
  if (t.tipo === 'entrega') {
    if (!Number.isInteger(cantidad) || cantidad < 1) return mostrarErrorCampo($('f-cantidad'), 'Escribe la cantidad que entregaste.');
    if (!hayFoto && !previas) return mostrarErrorCampo($('btn-foto'), 'Una entrega se termina con una foto.');
  }
  const u = edicion.ubicacion;
  await encolar(t, 'termine', { nota, cantidad, latitud: u ? u.latitud : '', longitud: u ? u.longitud : '', precision_m: u ? u.precision_m : '' }, edicion.fotos.map((f) => f.blob));
}

/* ----- fotos: se reducen aquí (1.280 px, JPEG); el servidor las vuelve a reducir y quita el EXIF ----- */
async function reducir(archivo) {
  try {
    const bmp = await createImageBitmap(archivo, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob((b) => ok(b || archivo), 'image/jpeg', 0.72));
  } catch (_) { return archivo; }
}
function liberarEdicion() { if (edicion) edicion.fotos.forEach((f) => URL.revokeObjectURL(f.url)); edicion = null; }
function pintarFotosForm() {
  const cont = $('fotos-tar');
  if (!cont || !edicion) return;
  cont.innerHTML = edicion.fotos.map((f, i) => `<div class="foto"><img src="${f.url}" alt="Foto ${i + 1}"><button type="button" data-quitar="${i}" aria-label="Quitar la foto ${i + 1}">×</button></div>`).join('');
  cont.querySelectorAll('button[data-quitar]').forEach((b) => b.addEventListener('click', () => { const [f] = edicion.fotos.splice(Number(b.dataset.quitar), 1); if (f) URL.revokeObjectURL(f.url); pintarFotosForm(); }));
  const t = tareas.find((x) => x.id === edicion.tareaId);
  const bf = $('btn-foto');
  if (bf) bf.style.display = edicion.fotos.length + (t ? t.fotos || 0 : 0) >= MAX_FOTOS ? 'none' : 'block';
}

/* ----- ubicación: opcional, con tiempo límite, NUNCA bloquea; una sola posición ----- */
function mostrarUbicacion() {
  const e = $('estado-ubicacion');
  if (e) e.textContent = edicion && edicion.ubicacion ? 'Ubicación guardada.' : 'No se pudo obtener la ubicación. Puedes seguir sin ella.';
}
function pedirUbicacion() {
  return new Promise((resolver) => {
    if (!navigator.geolocation) return resolver(null);
    let hecho = false;
    const fin = (v) => { if (!hecho) { hecho = true; resolver(v); } };
    setTimeout(() => fin(null), 9000);
    navigator.geolocation.getCurrentPosition(
      (p) => fin({ latitud: p.coords.latitude, longitud: p.coords.longitude, precision_m: Math.round(p.coords.accuracy) }),
      () => fin(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
async function tomarUbicacion() {
  const e = $('estado-ubicacion');
  if (e) e.textContent = 'Buscando tu ubicación…';
  const u = await pedirUbicacion();
  if (edicion) { edicion.ubicacion = u; mostrarUbicacion(); }
}

/* ----- carga ----- */
async function cargarServidor() {
  let datos = null, copia = false;
  try { datos = await api('/tareas/mias'); if (datos) guardarCacheReferencia('mis_tareas', datos); }
  catch (e) {
    // (parche 308) Esta rama nunca se ejecutaba: api() no ponía `error.status`. Y al ponerlo, pintar() la tapaba con «No tienes tareas asignadas»:
    // por eso se recuerda en `sinAcceso` y pintar() lo respeta.
    if (e && e.status === 403) { sinAcceso = true; tareas = []; return false; }
    datos = leerCacheReferencia('mis_tareas'); copia = !!datos;
  }
  if (!datos) { $('lista-servidor').innerHTML = '<p class="vacio-app">No se pudo cargar la lista. Con señal se carga sola.</p>'; return false; }
  sinAcceso = false;
  tareas = datos.tareas || [];
  $('nota-copia').style.display = copia ? 'block' : 'none';
  if (copia) $('nota-copia').textContent = 'Sin señal: se muestra la última lista que se guardó en este celular.';
  const r = datos.resumen;
  $('resumen').style.display = r ? 'flex' : 'none';
  if (r) $('resumen').innerHTML = `<div><b>${esc(r.pendientes)}</b><span>Pendientes</span></div><div><b>${esc(r.vencen_hoy)}</b><span>Vencen hoy</span></div><div><b>${esc(r.vencidas)}</b><span>Vencidas</span></div>`;
  return true;
}
async function refrescar(conSubida) {
  await leerCola();
  await cargarServidor();
  await leerCola();
  pintar();
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp('Mis tareas', 'Lo que tienes por hacer', '/app/inicio.html');
  $('archivo-foto').addEventListener('change', async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f || !edicion) return;
    const t = tareas.find((x) => x.id === edicion.tareaId);
    if (edicion.fotos.length + (t ? t.fotos || 0 : 0) >= MAX_FOTOS) return aviso(`Máximo ${MAX_FOTOS} fotos por tarea.`);
    const blob = await reducir(f);
    edicion.fotos.push({ blob, url: URL.createObjectURL(blob) });
    pintarFotosForm();
  });
  await leerCola();
  if (cola.length) await subirCola();
  await refrescar(false);
  window.addEventListener('online', async () => { await subirCola(); await refrescar(false); });
})();
</script>
