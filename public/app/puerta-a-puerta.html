<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5ED7">
<meta name="robots" content="noindex, nofollow">
<!-- A los servidores de teselas del mapa solo llega el DOMINIO de esta app (nunca la ruta de la página): lo justo para que Mapbox verifique la restricción de URL de su token. -->
<meta name="referrer" content="origin">
<title>Puerta a puerta · Estrategia</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estrategia">
<link rel="stylesheet" href="/app/estilos-app.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  /* PUERTA A PUERTA (parche 309): mi lista de visitas, ordenada por cercanía en el celular. */
  .grupo-titulo { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--marca-azul); margin: 18px 0 8px; }
  .caja-pp { background: #fff; border: 0; box-shadow: var(--sombra); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px;  -webkit-user-select: none; user-select: none; }
  .caja-pp .fila { display: flex; gap: 10px; align-items: flex-start; }
  .caja-pp .num { flex: 0 0 auto; min-width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .caja-pp .nombre { font-weight: 700; color: var(--navy); overflow-wrap: anywhere; }
  .caja-pp .dir { font-size: 0.9rem; margin-top: 2px; overflow-wrap: anywhere; }
  .caja-pp .meta { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .etiqueta { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--campo); color: var(--texto-2); white-space: nowrap; border: 0; margin-left: 4px; }
  .etiqueta.roja { background: var(--error-fondo); color: var(--error); }
  .etiqueta.ambar { background: var(--aviso-fondo); color: var(--aviso); }
  .etiqueta.verde { background: var(--ok-fondo); color: var(--ok); }
  .resultados { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .resultados .btn-app { width: 100%; }
  .resultados .ancho { grid-column: 1 / -1; }
  .panel-volver { margin-top: 10px; background: var(--aviso-fondo); border: 1px solid var(--marca-amarillo); border-radius: 14px; padding: 10px; font-size: 0.88rem; }
  .panel-volver label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .acciones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones .btn-app { flex: 1 1 120px; }
  .vacio-app { text-align: center; color: var(--texto-2); padding: 26px 8px; }
  .resumen-pp { display: flex; gap: 8px; margin: 10px 0 0; }
  .resumen-pp div { flex: 1; background: #fff; border: 0; box-shadow: var(--sombra); border-radius: 16px; padding: 8px; text-align: center; }
  .resumen-pp b { display: block; font-size: 1.2rem; color: var(--navy); }
  .resumen-pp span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  .nota-pp { background: var(--aviso-fondo); border: 1px solid var(--marca-amarillo); border-radius: 14px; padding: 8px 10px; margin: 10px 0; font-size: 0.86rem; }
  /* EL MAPA (parche 310): pines numerados en el orden de la ruta y una línea guía. Sin señal el fondo es liso: los pines y la línea se dibujan igual. */
  .mapa-pp { height: 270px; border-radius: 16px; border: 0; box-shadow: var(--sombra); background: #E6ECF3; overflow: hidden; margin-top: 10px; }
  .mapa-pp.leaflet-container { font: inherit; }
  .pin-pp { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pin-pp.sel { background: var(--marca-amarillo); color: #1b2333; transform: scale(1.25); }
  .caja-pp.sel { box-shadow: 0 0 0 3px var(--marca-amarillo), var(--sombra); }
  .caja-pp .num { cursor: pointer; }
  /* EL GUION (parche 312): plegado arriba de la ficha de cada puerta. */
  .guion-pp { margin: 0 0 10px; background: var(--cream); border: 1px solid var(--linea); border-radius: 10px; padding: 6px 10px; font-size: 0.86rem; }
  .guion-pp summary { cursor: pointer; font-weight: 700; color: var(--navy); }
  .guion-pp ol { margin: 8px 0 4px; padding-left: 20px; }
  .guion-pp li { margin: 0 0 6px; overflow-wrap: anywhere; }
  /* Después de «Alguien quiere registrarse»: abrir el registro, o mostrar el QR para que la persona se inscriba sola. */
  .velo-pp { position: fixed; inset: 0; background: rgba(16,35,63,.6); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .velo-pp .hoja { background: #fff; border-radius: 16px; padding: 18px; max-width: 380px; width: 100%; max-height: 92vh; max-height: 92dvh; overflow: auto; text-align: center; }
  .velo-pp h3 { margin: 0 0 6px; color: var(--navy); }
  .velo-pp .qr-url { font-size: 0.82rem; word-break: break-all; color: var(--navy); font-weight: 600; margin: 8px 0 0; }
  .velo-pp canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; }
  /* Sin imprimir: la lista lleva nombres y direcciones y no sale del celular. */
  @media print { body { display: none !important; } }
</style>
</head>
<body>

<div class="app-barra" id="app-barra"></div>

<main class="app-cuerpo">
  <div id="aviso" class="aviso-app"></div>
  <div id="bloque-estado"></div>
  <div id="bloque-mapa" style="display:none;">
    <div id="mapa-pp" class="mapa-pp" role="img" aria-label="Mapa con las puertas de la ruta, numeradas"></div>
    <p class="meta" id="nota-mapa">Los números son el orden de la ruta. La línea solo une los puntos en orden: no es una ruta por calles. Toca un número para ir a su ficha.</p>
  </div>
  <div class="resumen-pp" id="resumen" style="display:none;"></div>

  <div id="bloque-pendientes" style="display:none;">
    <p class="grupo-titulo">En este celular, sin subir</p>
    <div id="lista-pendientes"></div>
  </div>

  <div id="lista-servidor"><p class="vacio-app">Cargando…</p></div>
  <p id="nota-copia" class="meta" style="display:none; font-size:0.78rem; color:var(--muted);"></p>
</main>

<script src="/js/api-core.js"></script>
<script src="/js/form-utils.js"></script>
<script src="/js/offline-utils.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/puerta-reglas.js"></script>
<script src="/js/qrcode-generator.js"></script>
<script src="/app/app-comun.js"></script>
<script>
const STORE_COLA = 'puerta_pendientes';
const STORE_COPIA = 'puerta_cache';
const CLAVE_COPIA = 'mia';
const R = PuertaReglas;
const $ = (id) => document.getElementById(id);
const esc = (t) => escaparAppHtml(t);
const RESULTADO_TXT = {
  no_abrio: 'No abrió', no_interesado: 'No interesado', interesado: 'Interesado',
  quiere_registrarse: 'Alguien quiere registrarse', solicitud: 'Dejó una solicitud', no_volver: 'Pidió no volver',
};

let base = null;           // lo último que dijo el servidor (o la copia de este celular), SIN lo que está en la cola
let vista = null;          // base + lo que está en la cola (lo que se ve)
let cola = [];
let copiaDesde = null;     // cuándo se guardó la copia que se está mostrando (null = es del servidor ahora)
let sinAcceso = false;
let bloqueo = null;
let abierto = null;        // item con el panel de «pidió no volver» desplegado
const guionesAbiertos = new Set();   // las puertas cuyo «Ver guion» está desplegado (para que no se pliegue al repintar)
let inicioGps = null;      // { lat, lon } SOLO en memoria: sirve para ordenar y no se guarda ni se manda a ningún lado

function aviso(texto, tipo) {
  const a = $('aviso');
  a.textContent = texto || '';
  a.className = 'aviso-app' + (texto ? ' visible ' + (tipo || 'error') : '');
}
function fechaCorta(texto) {                                 // 'YYYY-MM-DD HH:MM' → «12 nov, 12:00 p. m.»
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(texto || '');
  if (!m) return texto || '';
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const h = Number(m[4]);
  return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) + ', ' + ((h % 12) || 12) + ':' + m[5] + (h >= 12 ? ' p. m.' : ' a. m.');
}

/* ----- la franja y los topes, juzgados AQUÍ también: sin señal el celular tiene que negarse solo ----- */
function franjaVigente() {
  const c = base && base.config ? base.config : {};
  const v = R.validarFranja(c.franja_desde || R.FRANJA_DESDE_DEFECTO, c.franja_hasta || R.FRANJA_HASTA_DEFECTO);
  return v.ok ? v : R.validarFranja(R.FRANJA_DESDE_DEFECTO, R.FRANJA_HASTA_DEFECTO);
}
function motivoParaNoVisitar(item, ahora) {
  const c = R.colombiaDe(ahora);
  if (base && base.config && R.esDiaDeLaEleccion(base.config.fecha_eleccion, ahora)) return 'Hoy es el día de la elección: ese día no se hacen visitas.';
  const f = franjaVigente();
  if (!R.enFranja(c.minutos, f.desde, f.hasta)) return `Fuera del horario permitido (de ${f.desdeTexto} a ${f.hastaTexto}). Esta visita no se guarda.`;
  if (item.ultima_fecha && !R.puedeReintentar(item.ultima_fecha, item.ultima_franja, ahora)) return `A esta puerta se puede volver desde el ${fechaCorta(R.reintentoDesde(item.ultima_fecha, item.ultima_franja))}.`;
  return null;
}

/* ----- la cola: cada resultado se guarda primero en el celular, SIN nombre ni dirección (solo la puerta y el resultado) ----- */
async function leerCola() { try { cola = await listarColaOffline(STORE_COLA); } catch (_) { cola = []; } return cola; }
function cuerpoDeVisita(r) {
  const p = r.payload || {};
  return { cliente_uuid: r.clienteUuid, item_id: r.itemId, resultado: r.resultado, marcado_en: p.marcado_en, tampoco_mensajes: p.tampoco_mensajes ? 1 : 0, guion_huella: p.guion_huella || null };
}
/* DE A UNA: el aviso de «volvió la señal» y el toque de un resultado pueden pedir subir al mismo tiempo. Las subidas se ponen en fila (la segunda ya no
   encuentra nada que subir), y así un mismo registro no viaja dos veces a la vez. */
let subiendo = Promise.resolve();
async function subirColaUnaVez() {
  const hay = (await leerCola()).filter((r) => r.estado !== 'fallido').length;
  if (!hay) return;
  try { await sincronizarCola(STORE_COLA, '/puerta-a-puerta/visitas', cuerpoDeVisita); } catch (_) { /* sin señal */ }
}
function subirCola() { subiendo = subiendo.then(subirColaUnaVez, subirColaUnaVez); return subiendo; }

/* ----- lo que se ve: la base más lo que está en la cola ----- */
function recontar(l) {
  l.total = l.items.length;
  l.pendientes = l.items.filter((i) => i.estado === 'pendiente').length;
  l.cerradas = l.items.filter((i) => i.estado === 'cerrada').length;
  l.agotadas = l.items.filter((i) => i.estado === 'agotada').length;
}
function aplicarLocal(datos, itemId, resultado, instante) {
  const c = R.colombiaDe(instante), franja = R.franjaDe(c.minutos);
  for (const l of datos.listas) {
    for (const it of l.items) {
      if (it.id !== itemId) continue;
      it.ultimo_resultado = resultado; it.ultima_fecha = c.fecha; it.ultima_franja = franja;
      if (resultado === 'no_abrio') {
        it.intentos = Number(it.intentos) + 1;
        it.estado = it.intentos >= R.MAX_INTENTOS ? 'agotada' : 'pendiente';
        it.reintento_desde = it.estado === 'pendiente' ? R.reintentoDesde(c.fecha, franja) : null;
      } else { it.estado = 'cerrada'; it.reintento_desde = null; }
      if (it.estado !== 'pendiente') { it.nombre = null; it.direccion = null; it.latitud = null; it.longitud = null; }
      recontar(l);
    }
  }
}
function armarVista() {
  vista = base ? JSON.parse(JSON.stringify(base)) : null;
  if (!vista) return;
  cola.filter((r) => r.estado !== 'fallido').slice().sort((a, b) => (a.creadoEn || 0) - (b.creadoEn || 0))
    .forEach((r) => aplicarLocal(vista, r.itemId, r.resultado, new Date((r.payload || {}).marcado_en)));
}
function itemsDeLaVista() { return vista ? vista.listas.reduce((t, l) => t.concat(l.items), []) : []; }

/* ----- el dibujo ----- */
function etiquetasDe(it) {
  const e = [];
  if (it.intentos > 0) e.push(`<span class="etiqueta ambar">Intento ${esc(it.intentos)} de ${esc(R.MAX_INTENTOS)}</span>`);
  if (cola.some((r) => r.itemId === it.id && r.estado !== 'fallido')) e.push('<span class="etiqueta ambar">Esperando señal</span>');
  return e.join('');
}
function cajaDe(it, n) {
  const panel = abierto === it.id ? `<div class="panel-volver"><b>Pidió no volver.</b> No se le va a visitar más.
      <label><input type="checkbox" id="chk-mensajes"> <span>Tampoco quiere mensajes (SMS, correo ni WhatsApp)</span></label>
      <div class="acciones"><button type="button" class="btn-app btn-app-primario" data-confirmar-no-volver="${esc(it.id)}">Confirmar</button>
      <button type="button" class="btn-app btn-app-secundario" data-cancelar-no-volver>Cancelar</button></div></div>` : '';
  const g = vista && vista.guion && Array.isArray(vista.guion.pasos) && vista.guion.pasos.length ? vista.guion : null;
  const guion = g ? `<details class="guion-pp" data-guion="${esc(it.id)}"${guionesAbiertos.has(it.id) ? ' open' : ''}><summary>Ver guion</summary><ol>${g.pasos.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></details>` : '';
  return `<div class="caja-pp" data-item="${esc(it.id)}">${guion}<div class="fila"><span class="num" data-ver-en-mapa="${esc(it.id)}" title="Ver en el mapa">${n}</span><div style="flex:1;min-width:0;">
    <div class="nombre">${esc(it.nombre || '(sin nombre)')} ${etiquetasDe(it)}</div>
    <div class="dir">${esc(it.direccion || '')}</div>
    ${it.latitud === null || it.latitud === undefined ? '<div class="meta">Sin ubicación en el mapa: va al final de la ruta.</div>' : ''}
    <div class="resultados">
      <button type="button" class="btn-app btn-app-secundario" data-resultado="no_abrio" data-id="${esc(it.id)}">No abrió</button>
      <button type="button" class="btn-app btn-app-secundario" data-resultado="no_interesado" data-id="${esc(it.id)}">No interesado</button>
      <button type="button" class="btn-app btn-app-primario" data-resultado="interesado" data-id="${esc(it.id)}">Interesado</button>
      <button type="button" class="btn-app btn-app-secundario" data-resultado="quiere_registrarse" data-id="${esc(it.id)}">Alguien quiere registrarse</button>
      ${solicitudesActivas ? `<button type="button" class="btn-app btn-app-secundario" data-resultado="solicitud" data-id="${esc(it.id)}">Dejó una solicitud</button>` : ''}
      <button type="button" class="btn-app btn-app-secundario" data-pedir-no-volver="${esc(it.id)}">Pidió no volver</button>
    </div>${panel}</div></div></div>`;
}
function esperaDe(it) {
  return `<div class="caja-pp"><div class="nombre">${esc(it.nombre || '')} ${etiquetasDe(it)}</div><div class="dir">${esc(it.direccion || '')}</div>
    <div class="meta">Ya la tocaste. Se puede volver a tocar desde el ${esc(fechaCorta(it.reintento_desde))}.</div></div>`;
}

function pintarPendientes() {
  $('bloque-pendientes').style.display = cola.length ? 'block' : 'none';
  $('lista-pendientes').innerHTML = cola.slice().sort((a, b) => (b.creadoEn || 0) - (a.creadoEn || 0)).map((r) => {
    const fallida = r.estado === 'fallido';
    return `<div class="caja-pp"><div class="nombre">Una puerta <span class="etiqueta ${fallida ? 'roja' : 'ambar'}">${fallida ? 'No se pudo subir' : 'Esperando señal'}</span></div>
      <div class="meta">${esc(RESULTADO_TXT[r.resultado] || r.resultado)}</div>
      ${fallida ? `<div class="meta" style="color:var(--error); margin-top:6px;">${esc(r.error || '')}</div><div class="acciones"><button type="button" class="btn-app btn-app-primario" data-reintentar="${esc(r.clienteUuid)}">Reintentar</button>
        <button type="button" class="btn-app btn-app-secundario" data-descartar="${esc(r.clienteUuid)}">Descartar</button></div>` : ''}</div>`;
  }).join('');
  $('lista-pendientes').querySelectorAll('[data-reintentar]').forEach((b) => b.addEventListener('click', async () => {
    const r = cola.find((x) => x.clienteUuid === b.dataset.reintentar);
    if (!r) return;
    delete r.estado; delete r.error;
    await guardarEnColaOffline(STORE_COLA, r);
    await subirCola();
    await refrescar();
  }));
  $('lista-pendientes').querySelectorAll('[data-descartar]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('¿Descartar este resultado? No se subirá.')) return;
    await borrarDeColaOffline(STORE_COLA, b.dataset.descartar);
    await refrescar();
  }));
}

function pintar() {
  pintarPendientes();
  limpiarMapa();
  const estado = $('bloque-estado');
  estado.innerHTML = '';
  $('resumen').style.display = 'none';
  if (sinAcceso) { $('lista-servidor').innerHTML = '<p class="vacio-app">Tu tipo de usuario no tiene habilitado el puerta a puerta. Pídeselo al administrador de la campaña.</p>'; return; }
  if (bloqueo) { $('lista-servidor').innerHTML = `<p class="vacio-app">${esc(bloqueo)}</p>`; return; }
  if (!vista) { $('lista-servidor').innerHTML = '<p class="vacio-app">No se pudo cargar la lista. Con señal se baja sola.</p>'; return; }
  armarVista();
  const todos = itemsDeLaVista();
  if (!todos.length) { $('lista-servidor').innerHTML = '<p class="vacio-app">No tienes una lista de visitas asignada.</p>'; return; }

  const ahora = new Date();
  const f = franjaVigente();
  estado.innerHTML = `<div class="nota-pp">Horario de visitas: de ${esc(f.desdeTexto)} a ${esc(f.hastaTexto)}. ${R.enFranja(R.colombiaDe(ahora).minutos, f.desde, f.hasta) ? '' : '<b>Ahora estás fuera del horario: no se guarda ninguna visita.</b>'}
    <div class="acciones"><button type="button" class="btn-app btn-app-secundario" id="btn-gps">📍 Mi ubicación</button></div>
    <div class="meta" id="estado-gps">${inicioGps ? 'Ruta ordenada desde tu ubicación. Tu ubicación no se guarda ni se envía.' : 'Ruta ordenada desde la primera puerta. Si quieres, toca «Mi ubicación» para ordenarla desde donde estás: se lee una sola vez, no se guarda ni se envía.'}</div></div>`;
  $('btn-gps').addEventListener('click', tomarUbicacion);

  const pend = todos.filter((i) => i.estado === 'pendiente');
  const cerradas = todos.filter((i) => i.estado !== 'pendiente').length;
  $('resumen').style.display = 'flex';
  $('resumen').innerHTML = `<div><b>${esc(pend.length)}</b><span>Por visitar</span></div><div><b>${esc(todos.filter((i) => i.estado === 'cerrada').length)}</b><span>Cerradas</span></div><div><b>${esc(todos.filter((i) => i.estado === 'agotada').length)}</b><span>Sin respuesta</span></div>`;

  // Las que ya se tocaron y todavía no se pueden volver a tocar, aparte; el resto, en la ruta.
  const esperando = pend.filter((i) => i.ultima_fecha && !R.puedeReintentar(i.ultima_fecha, i.ultima_franja, ahora));
  const enRuta = pend.filter((i) => !esperando.includes(i));
  const orden = R.ordenarPorCercania(enRuta.map((i, k) => ({ id: i.id, orden: k, lat: i.latitud, lon: i.longitud })), inicioGps);
  const porId = new Map(enRuta.map((i) => [i.id, i]));
  let html = orden.length ? `<p class="grupo-titulo">Ruta sugerida (${orden.length})</p>${orden.map((id, k) => cajaDe(porId.get(id), k + 1)).join('')}` : '';
  if (esperando.length) html += `<p class="grupo-titulo">Para volver más tarde (${esperando.length})</p>${esperando.map(esperaDe).join('')}`;
  if (!pend.length) html += `<p class="vacio-app">No te quedan puertas por visitar. ${cerradas ? `Cerraste ${esc(cerradas)}.` : ''}</p>`;
  $('lista-servidor').innerHTML = html;
  dibujarMapa(orden.map((id) => porId.get(id)));
  aplicarSeleccion();

  const lista = $('lista-servidor');
  lista.querySelectorAll('details[data-guion]').forEach((d) => d.addEventListener('toggle', () => { const id = Number(d.dataset.guion); if (d.open) guionesAbiertos.add(id); else guionesAbiertos.delete(id); }));
  lista.querySelectorAll('[data-ver-en-mapa]').forEach((b) => b.addEventListener('click', () => seleccionar(Number(b.dataset.verEnMapa), false)));
  lista.querySelectorAll('[data-resultado]').forEach((b) => b.addEventListener('click', () => registrar(Number(b.dataset.id), b.dataset.resultado)));
  lista.querySelectorAll('[data-pedir-no-volver]').forEach((b) => b.addEventListener('click', () => { abierto = Number(b.dataset.pedirNoVolver); pintar(); }));
  lista.querySelectorAll('[data-cancelar-no-volver]').forEach((b) => b.addEventListener('click', () => { abierto = null; pintar(); }));
  lista.querySelectorAll('[data-confirmar-no-volver]').forEach((b) => b.addEventListener('click', () => {
    const tampoco = !!($('chk-mensajes') && $('chk-mensajes').checked);
    registrar(Number(b.dataset.confirmarNoVolver), 'no_volver', { tampoco_mensajes: tampoco });
  }));
}

/* ----- el mapa (parche 310) -----
   · Leaflet viene de /vendor/leaflet (de esta app), NUNCA de un CDN: dibuja los pines y la línea SIN señal.
   · Los números de los pines son los de la lista, en el orden de la ruta. La línea los une en ese orden: es solo una guía, no una ruta por calles.
   · El FONDO (las teselas) es lo único que sale a la red, y solo con señal: Mapbox si la campaña tiene token y OpenStreetMap si no (la misma fuente que el
     mapa territorial). Una tesela pide únicamente «zoom/x/y» de la zona que se mira: ninguna dirección, nombre ni dato de la lista viaja a ese servidor.
     Las teselas NO se descargan por adelantado ni se guardan (el service worker no toca recursos de otro origen). Sin señal el fondo es liso.
   · «Mi ubicación» (inicioGps) se usa aquí solo para dibujar el punto de partida y la línea; sigue sin guardarse ni enviarse. */
let mapa = null, capaPines = null, capaLinea = null, capaInicio = null, capaTeselas = null;
let tokenMapa;                          // undefined = todavía no se sabe; null = sin token (OpenStreetMap); texto = token público de Mapbox
let firmaRuta = '';
let seleccionado = null;                // id de la puerta cuya ficha está resaltada
const pinesPorId = new Map();

function iconoPin(n, sel) {
  return L.divIcon({ className: '', html: `<div class="pin-pp${sel ? ' sel' : ''}">${n}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
}
function limpiarMapa() {
  $('bloque-mapa').style.display = 'none';
  if (capaPines) capaPines.clearLayers();
  if (capaLinea) capaLinea.clearLayers();
  if (capaInicio && mapa) { mapa.removeLayer(capaInicio); capaInicio = null; }
  pinesPorId.clear();
  window.__ppMapa = { pines: [], linea: [] };
}
function asegurarMapa() {
  if (mapa || typeof L === 'undefined') return mapa;
  mapa = L.map('mapa-pp', { attributionControl: false }).setView([4.6, -74.1], 6);
  L.control.attribution({ prefix: false }).addTo(mapa);
  capaLinea = L.layerGroup().addTo(mapa);
  capaPines = L.layerGroup().addTo(mapa);
  mapa.on('zoomend', separarPines);
  return mapa;
}
/** El fondo, solo con señal. Primero se averigua si hay token (una vez); sin señal se quita y queda el fondo liso. */
async function ponerTeselas() {
  if (!mapa) return;
  if (navigator.onLine === false) { if (capaTeselas) { mapa.removeLayer(capaTeselas); capaTeselas = null; } return; }
  if (capaTeselas) return;
  if (tokenMapa === undefined) {
    try { const r = await api('/puerta-a-puerta/mapa-config'); tokenMapa = (r && r.mapbox_token) || null; }
    catch (_) { return; }                                                // sin respuesta: se vuelve a intentar al volver la señal; mientras tanto, fondo liso
    if (navigator.onLine === false || capaTeselas) return;
  }
  const opciones = { referrerPolicy: 'origin' };
  capaTeselas = tokenMapa
    ? L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=${tokenMapa}`,
        Object.assign({ tileSize: 512, zoomOffset: -1, maxZoom: 22, attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> © <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' }, opciones))
    : L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', Object.assign({ maxZoom: 19, attribution: '&copy; colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }, opciones));
  capaTeselas.on('tileerror', () => { /* una tesela que no llega deja el fondo liso: no es un error de la lista */ });
  capaTeselas.addTo(mapa);
  capaTeselas.bringToBack();
}
/* PINES ENCIMA UNO DE OTRO (parche 312). Dos puertas casi en el mismo punto (el mismo edificio, dos casas pegadas) dibujaban un pin sobre otro y uno quedaba
   escondido. Al DIBUJAR —nunca en los datos— los pines que quedan a menos de un pin de distancia en la pantalla se abren en círculo alrededor de su centro,
   cada uno con su número. Las coordenadas guardadas no cambian (`pinesPorId[].ll` y la copia del celular siguen iguales). Se recalcula al hacer zoom: al acercarse
   se separan solos y vuelven a su sitio. */
const DISTANCIA_PIN = 30;       // píxeles: el pin mide 28
function separarPines() {
  if (!mapa || !pinesPorId.size) return;
  const lista = Array.from(pinesPorId.values()).sort((a, b) => a.n - b.n);
  const xy = lista.map((p) => mapa.latLngToLayerPoint(p.ll));
  const hecho = new Set();
  window.__ppMapa.separados = [];
  lista.forEach((p, i) => {
    if (hecho.has(i)) return;
    const grupo = [i]; hecho.add(i);
    for (let j = i + 1; j < lista.length; j++) if (!hecho.has(j) && grupo.some((g) => xy[g].distanceTo(xy[j]) < DISTANCIA_PIN)) { grupo.push(j); hecho.add(j); }
    if (grupo.length === 1) { lista[i].m.setLatLng(lista[i].ll); return; }
    const cx = grupo.reduce((t, g) => t + xy[g].x, 0) / grupo.length, cy = grupo.reduce((t, g) => t + xy[g].y, 0) / grupo.length;
    const r = Math.max(17, DISTANCIA_PIN / (2 * Math.sin(Math.PI / grupo.length)));
    grupo.forEach((g, k) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * k) / grupo.length;
      lista[g].m.setLatLng(mapa.layerPointToLatLng(L.point(cx + r * Math.cos(ang), cy + r * Math.sin(ang))));
    });
    window.__ppMapa.separados.push(grupo.map((g) => lista[g].n));
  });
}
/** `ruta`: las puertas en el orden de la ruta (las que no tienen coordenadas no tienen pin, pero conservan su número en la lista). */
function dibujarMapa(ruta) {
  const conPunto = ruta.map((it, k) => ({ it, n: k + 1 })).filter((x) => x.it.latitud !== null && x.it.latitud !== undefined && Number.isFinite(Number(x.it.latitud)) && Number.isFinite(Number(x.it.longitud)));
  if (!conPunto.length || typeof L === 'undefined') return;
  $('bloque-mapa').style.display = 'block';
  asegurarMapa();
  const puntos = [];
  if (inicioGps) {
    puntos.push([inicioGps.lat, inicioGps.lon]);
    capaInicio = L.circleMarker([inicioGps.lat, inicioGps.lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#1B6EF3', fillOpacity: 1, interactive: false }).addTo(mapa);
  }
  conPunto.forEach(({ it, n }) => {
    const ll = [Number(it.latitud), Number(it.longitud)];
    puntos.push(ll);
    const m = L.marker(ll, { icon: iconoPin(n, it.id === seleccionado), title: 'Puerta ' + n }).on('click', () => seleccionar(it.id, true)).addTo(capaPines);
    pinesPorId.set(it.id, { m, n, ll });
    window.__ppMapa.pines.push({ id: it.id, n, lat: ll[0], lon: ll[1] });
  });
  if (puntos.length > 1) L.polyline(puntos, { color: '#0B5ED7', weight: 3, opacity: 0.7, dashArray: '6 6', interactive: false }).addTo(capaLinea);
  window.__ppMapa.linea = puntos;
  mapa.invalidateSize();
  const firma = conPunto.map((x) => x.it.id).join(',') + '|' + (inicioGps ? inicioGps.lat + ',' + inicioGps.lon : '');
  if (firma !== firmaRuta) {                                            // solo se reencuadra cuando la ruta cambia: no salta mientras la persona mueve el mapa
    firmaRuta = firma;
    mapa.fitBounds(puntos, { padding: [30, 30], maxZoom: 17 });
  }
  separarPines();
  ponerTeselas();
}
/** Resalta la ficha y el pin de una puerta. Al tocar el pin, la lista se desplaza hasta su ficha (la MISMA ficha de la lista, con sus botones). */
function seleccionar(id, desdePin) {
  seleccionado = id;
  aplicarSeleccion();
  const ficha = document.querySelector(`#lista-servidor .caja-pp[data-item="${id}"]`);
  if (desdePin && ficha) ficha.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (!desdePin && mapa && pinesPorId.has(id)) mapa.panTo(pinesPorId.get(id).ll);
}
function aplicarSeleccion() {
  document.querySelectorAll('#lista-servidor .caja-pp.sel').forEach((e) => e.classList.remove('sel'));
  const ficha = seleccionado === null ? null : document.querySelector(`#lista-servidor .caja-pp[data-item="${seleccionado}"]`);
  if (ficha) ficha.classList.add('sel'); else seleccionado = null;
  pinesPorId.forEach((p, pid) => p.m.setIcon(iconoPin(p.n, pid === seleccionado)));
}
window.addEventListener('offline', () => { ponerTeselas(); });
window.addEventListener('online', () => { ponerTeselas(); });

/* ----- registrar el resultado de una puerta ----- */
async function registrar(itemId, resultado, extra) {
  aviso('');
  const it = itemsDeLaVista().find((x) => x.id === itemId);
  if (!it || it.estado !== 'pendiente') return aviso('Esa puerta ya no está por visitar.');
  const ahora = new Date();
  const motivo = motivoParaNoVisitar(it, ahora);
  if (motivo) return aviso(motivo);                                    // fuera de la franja, ese día o antes de tiempo: NO se guarda, ni en el celular
  if (cola.some((r) => r.itemId === itemId && r.estado !== 'fallido')) return aviso('Esa puerta ya tiene un resultado esperando señal.');
  const registro = {
    clienteUuid: generarUuid(), creadoEn: Date.now(), itemId, resultado,
    payload: { marcado_en: ahora.toISOString(), tampoco_mensajes: !!(extra && extra.tampoco_mensajes), guion_huella: base && base.guion ? base.guion.huella : null },
  };
  try { await guardarEnColaOffline(STORE_COLA, registro); }              // lo primero: que no se pierda aunque se cierre la app
  catch (e) { return aviso('No se pudo guardar en este celular. Revisa el espacio disponible e inténtalo de nuevo.'); }
  abierto = null;
  // Una puerta con resultado final deja de necesitar nombre y dirección: se quitan también de la copia guardada.
  if (resultado !== 'no_abrio' && base) {
    base.listas.forEach((l) => l.items.forEach((x) => { if (x.id === itemId) { x.nombre = null; x.direccion = null; x.latitud = null; x.longitud = null; } }));
    guardarCopiaOffline(STORE_COPIA, CLAVE_COPIA, base).catch(() => {});
  }
  await leerCola();
  pintar();
  const destino = resultado === 'quiere_registrarse' ? '/app/registro-votante.html' : (resultado === 'solicitud' && solicitudesActivas ? '/app/solicitud-nueva.html' : null);
  await subirCola();
  if (destino) {
    if (resultado === 'quiere_registrarse' && vista && vista.inscripcion) { ofrecerRegistro(destino, vista.inscripcion); return; }   // con enlace propio: también el QR
    location.href = destino; return;                                    // abre la pantalla normal; NO se guarda de cuál visita vino
  }
  await refrescar();
  const resto = cola.find((r) => r.clienteUuid === registro.clienteUuid);
  if (resto && resto.estado === 'fallido') return aviso(`${resto.error || 'No se pudo registrar.'} Quedó guardado en este celular: puedes reintentarlo o descartarlo.`);
  aviso(resto ? 'Guardado en tu celular. Se sube solo cuando haya señal.' : 'Listo.', 'exito');
}

/* ----- «Alguien quiere registrarse»: el registro normal, o el QR del enlace de inscripción de quien visita (parche 312) -----
   El QR es SU enlace de siempre (el de «Mi enlace de inscripción»): la persona se inscribe sola desde su celular y queda como votante de quien visita, pendiente
   de confirmar. Viaja con la lista (sin señal se usa la copia). Sin enlace (rol, inscripción apagada o enlace desactivado) esto no se ofrece: se abre el registro. */
function dibujarQR(lienzo, texto, px) {
  const qr = qrcode(0, 'M');
  qr.addData(texto);
  qr.make();
  const n = qr.getModuleCount(), margen = 4, celda = Math.floor(px / (n + margen * 2)), lado = celda * (n + margen * 2);
  lienzo.width = lado; lienzo.height = lado;
  const g = lienzo.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, lado, lado);
  g.fillStyle = '#000000';
  for (let f = 0; f < n; f++) for (let c = 0; c < n; c++) if (qr.isDark(f, c)) g.fillRect((c + margen) * celda, (f + margen) * celda, celda, celda);
}
function ofrecerRegistro(destino, insc) {
  const previo = $('velo-registro'); if (previo) previo.remove();
  const url = String(insc.base || window.location.origin).replace(/\/+$/, '') + insc.ruta;
  const v = document.createElement('div');
  v.id = 'velo-registro'; v.className = 'velo-pp';
  v.innerHTML = `<div class="hoja" role="dialog" aria-labelledby="vr-titulo"><h3 id="vr-titulo">Alguien quiere registrarse</h3>
    <p class="meta" style="font-size:.86rem;color:var(--muted);">El resultado ya quedó guardado. Registra a la persona tú mismo, o muéstrale el código para que se inscriba desde su celular.</p>
    <div id="vr-qr" style="display:none;"><canvas id="vr-lienzo" width="300" height="300" aria-label="Código QR de tu enlace de inscripción"></canvas>
      <p class="qr-url" id="vr-url"></p><p class="meta" style="font-size:.8rem;color:var(--muted);">Que lo escanee con la cámara de su celular. Quedará registrada como tu contacto, pendiente de confirmar.</p></div>
    <div class="acciones" style="flex-direction:column;"><button type="button" class="btn-app btn-app-primario" id="vr-qr-btn">Mostrar código QR</button>
      <button type="button" class="btn-app btn-app-secundario" id="vr-abrir">Abrir el registro</button>
      <button type="button" class="btn-app btn-app-secundario" id="vr-cerrar">Listo</button></div></div>`;
  document.body.appendChild(v);
  $('vr-qr-btn').addEventListener('click', () => {
    $('vr-qr').style.display = 'block'; $('vr-url').textContent = url;
    dibujarQR($('vr-lienzo'), url, 300);
    $('vr-qr-btn').style.display = 'none';
  });
  $('vr-abrir').addEventListener('click', () => { location.href = destino; });
  $('vr-cerrar').addEventListener('click', async () => { v.remove(); await refrescar(); aviso('Listo.', 'exito'); });
}

/* ----- ubicación: opcional, una sola lectura, SOLO en memoria ----- */
function pedirUbicacion() {
  return new Promise((resolver) => {
    if (!navigator.geolocation) return resolver(null);
    let hecho = false;
    const fin = (v) => { if (!hecho) { hecho = true; resolver(v); } };
    setTimeout(() => fin(null), 9000);
    navigator.geolocation.getCurrentPosition((p) => fin({ lat: p.coords.latitude, lon: p.coords.longitude }), () => fin(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
async function tomarUbicacion() {
  $('estado-gps').textContent = 'Buscando tu ubicación…';
  const u = await pedirUbicacion();
  if (!u) { $('estado-gps').textContent = 'No se pudo obtener tu ubicación. Puedes seguir sin ella.'; return; }
  inicioGps = u;
  pintar();
}

/* ----- carga: la del servidor o, sin señal, la copia de ESTE usuario si no ha caducado ----- */
async function cargarServidor() {
  sinAcceso = false; bloqueo = null; copiaDesde = null;
  let datos = null;
  try {
    datos = await api('/puerta-a-puerta/mias');
    if (datos === undefined) datos = null;
  } catch (e) {
    if (e && e.status === 403) { sinAcceso = true; base = null; return false; }
    datos = null;
    if (e && e.status && !e.esErrorDeRed) { $('lista-servidor').innerHTML = '<p class="vacio-app">No se pudo cargar la lista. Inténtalo de nuevo en un momento.</p>'; }
  }
  if (datos) {
    if (datos.bloqueo) {                                                // el día de la elección: no hay lista y la copia guardada se borra
      bloqueo = datos.bloqueo.mensaje; base = null;
      await borrarCopia();
      return true;
    }
    base = datos;
    if (datos.listas && datos.listas.length) await guardarCopiaOffline(STORE_COPIA, CLAVE_COPIA, datos).catch(() => {});
    else await borrarCopia();
    return true;
  }
  // Sin señal: la copia de ESTE usuario, mientras no haya caducado.
  let copia = null;
  try { copia = await leerCopiaOffline(STORE_COPIA, CLAVE_COPIA); } catch (_) { copia = null; }
  if (!copia) { base = null; return false; }
  if (R.caducoLaCopia(copia.guardadoEn)) {
    await borrarCopia();
    base = null;
    bloqueo = 'La lista que tenías guardada en este celular caducó (dura 48 horas). Con señal se baja otra.';
    return false;
  }
  if (copia.datos && copia.datos.config && R.esDiaDeLaEleccion(copia.datos.config.fecha_eleccion, new Date())) {
    await borrarCopia();
    base = null;
    bloqueo = 'Hoy es el día de la elección y ese día no se hacen visitas.';
    return false;
  }
  base = copia.datos; copiaDesde = copia.guardadoEn;
  return true;
}
async function borrarCopia() {
  try { const c = await leerCopiaOffline(STORE_COPIA, CLAVE_COPIA); if (c) await borrarDeColaOffline(STORE_COPIA, c.clienteUuid); } catch (_) { /* nada que borrar */ }
}
async function refrescar() {
  await leerCola();
  await cargarServidor();
  await leerCola();
  vista = base;
  pintar();
  const nota = $('nota-copia');
  if (copiaDesde) {
    nota.style.display = 'block';
    nota.textContent = `Sin señal: se muestra la lista guardada en este celular. Caduca el ${new Date(copiaDesde + R.HORAS_COPIA * 3600 * 1000).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}.`;
  } else if (base && base.config) {
    nota.style.display = 'block';
    nota.textContent = `Esta lista queda guardada en tu celular por ${R.HORAS_COPIA} horas, o hasta que cierres sesión.`;
  } else nota.style.display = 'none';
}

/* ACTIVAR COMPLEMENTOS (parche 318): el resultado «Dejó una solicitud» lleva a Solicitudes ciudadanas, así que solo se ofrece con ese complemento encendido.
   Sin señal se usa lo último que dijo el servidor en este celular; sin nada guardado, apagado (falla cerrado). */
let solicitudesActivas = false;
async function saberSiHaySolicitudes() {
  try {
    const r = await api('/permisos/mios');
    solicitudesActivas = !!(r && r.complementos && r.complementos.solicitudes === true);
    try { localStorage.setItem('complementos_conocidos', JSON.stringify((r && r.complementos) || {})); } catch (e) { /* sin almacenamiento */ }
  } catch (e) {
    try { solicitudesActivas = (JSON.parse(localStorage.getItem('complementos_conocidos') || '{}')).solicitudes === true; } catch (e2) { solicitudesActivas = false; }
  }
}

(async () => {
  const usuario = await requerirSesionApp();
  if (!usuario) return;
  pintarBarraApp('Puerta a puerta', 'Tu lista de visitas', '/app/inicio.html');
  await saberSiHaySolicitudes();
  await leerCola();
  if (cola.length) await subirCola();
  await refrescar();
  window.addEventListener('online', async () => { await subirCola(); await refrescar(); });
})();
</script>
