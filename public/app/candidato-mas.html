<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5ED7">
<title>Más · Candidato</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="stylesheet" href="/app/estilos-app.css">
<link rel="stylesheet" href="/app/candidato-letra.css">
<link rel="stylesheet" href="/app/candidato.css">
<style>
  /* El globo rojo con las tareas de dirección vencidas (orden 116) */
  .cand-menu .menu-boton { position: relative; }
  .cand-menu .menu-boton .globo { position: absolute; top: 6px; right: 8px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: #d63a3a; color: #fff; font-size: 14px; font-weight: 800; line-height: 24px; text-align: center; }
</style>
</head>
<body class="cand">
<div class="cand-ancho">
  <div class="barra"><small>Más</small><h1>Más opciones</h1></div>
  <div id="estado"></div>
  <div id="error-carga" class="error-carga" role="alert"></div>
  <div id="aviso-modo" role="alert" style="display:none; margin:0 16px 14px; padding:14px 16px; border-radius:14px; background:#fff4d6; border:1.5px solid #f0c24a; color:#4a3500; font-size:var(--c-med, 15px); line-height:1.45;"></div>
  <div class="cand-menu menu-app" id="menu-app"></div>
</div>
<script src="/js/api-core.js"></script>
<script src="/js/cuentas-dispositivo.js"></script>
<script src="/app/app-comun.js"></script>
<script src="/js/es-celular.js"></script>
<script src="/app/candidato-nav.js"></script>
<script>
let usuario = null;
let vencidas = 0;   // Tareas de dirección vencidas (orden 116): el globo rojo de su tarjeta
/* LA CUADRÍCULA ES LA DEL MENÚ DE /app/inicio.html (orden 75): las mismas clases de estilos-app.css —.menu-grupo con su barra amarilla, .menu-grid de tres columnas, .menu-boton con el icono en
   cuadro azul claro—. Una tarjeta es un enlace (abre otra pantalla: desde la orden 79 también las de «Seguimiento», con su flecha de vuelta a «Más») o un botón (cerrar la sesión).
   Un grupo sin tarjetas no se pinta: ni títulos solos ni huecos. */
function tarjeta(t) {
  const globo = t.globo ? '<span class="globo" aria-label="' + cEsc(t.globo) + ' vencidas">' + cEsc(t.globo) + '</span>' : '';
  const interior = globo + '<div class="icono" aria-hidden="true">' + t.ic + '</div><div class="texto"><strong>' + cEsc(t.texto) + '</strong></div>';
  if (t.href) return '<a class="menu-boton" href="' + cEsc(t.href) + '">' + interior + '</a>';
  return '<button type="button" class="menu-boton" data-accion="' + cEsc(t.accion) + '">' + interior + '</button>';
}
function pintarMenu(s) {
  // Orden 81: el administrador que también es el candidato ve arriba «Modo administrador», que lo lleva a la app de administración del celular (allí, «Modo candidato» lo regresa).
  // Orden 93: en una sesión «solo candidato» (equipo sin autorizar) el botón está, pero no cambia de modo: dice qué hacer (ver el clic, abajo).
  const modo = (cEsAdminCandidato(usuario) || usuario.solo_candidato) ? [{ titulo: 'Cambiar de modo', items: [{ ic: '🛠️', texto: 'Modo administrador', accion: 'modo_admin' }] }] : [];
  const grupos = modo.concat([
    { titulo: 'Registro', items: [
      { ic: '🔒', texto: 'Tareas de dirección', href: '/app/candidato-tareas.html', globo: vencidas > 0 ? String(vencidas) : '' },
      s.registro && { ic: '➕', texto: 'Registrar en la estructura territorial', href: '/territorial.html?app=1&volver=/app/candidato.html#nuevo' },
      { ic: '🗳️', texto: 'Consultar puesto de votación', href: '/app/puesto-votacion.html' } ] },
    { titulo: 'Seguimiento', items: [
      s.solicitudes && { ic: '📨', texto: 'Solicitudes', href: '/app/candidato-seguimiento.html?seccion=solicitudes' },
      s.tareas && { ic: '✅', texto: 'Tareas', href: '/app/candidato-seguimiento.html?seccion=tareas' },
      s.puerta && { ic: '🚪', texto: 'Puerta a puerta', href: '/app/candidato-seguimiento.html?seccion=puerta' },
      s.dia_d && { ic: '🏁', texto: 'Día D · avance de votación', href: '/app/candidato-seguimiento.html?seccion=dia_d' } ] },
    { titulo: 'Material de apoyo', items: [
      s.biografia && { ic: '👤', texto: 'Biografía del candidato', href: '/app/biografia.html' },
      s.recursos && { ic: '📚', texto: 'Información para compartir', href: '/app/informacion.html?modo=informacion' } ] },
    { titulo: 'Mi cuenta y ayuda', items: [
      { ic: '🔔', texto: 'Mis avisos', href: '/app/mis-avisos.html' },
      { ic: '🔑', texto: 'Cambiar mi clave', href: '/app/candidato-clave.html' },
      s.politica && { ic: '🔒', texto: 'Política de privacidad', href: '/app/politica-privacidad.html' },
      s.legislacion && { ic: '⚖️', texto: 'Legislación', href: '/app/legislacion.html' },
      { ic: '❔', texto: 'Ayuda', href: '/ayuda.html?app=1' },
      { ic: '🚪', texto: 'Cerrar sesión', accion: 'salir' } ] },
  ]);
  document.getElementById('menu-app').innerHTML = grupos
    .map((g) => ({ titulo: g.titulo, items: g.items.filter(Boolean) }))
    .filter((g) => g.items.length)
    .map((g) => '<section class="menu-grupo"><h2 class="menu-grupo-titulo">' + cEsc(g.titulo) + '</h2><div class="menu-grid">' + g.items.map(tarjeta).join('') + '</div></section>')
    .join('');
}

(async function () {
  usuario = await exigirCandidatoApp('mas');
  if (!usuario) return;
  document.getElementById('menu-app').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-accion]'); if (!b) return;
    if (b.dataset.accion === 'salir') cPedirSalir();   // con la misma confirmación que el «Salir» del encabezado
    if (b.dataset.accion === 'modo_admin') {
      if (usuario.solo_candidato) {
        const a = document.getElementById('aviso-modo');
        a.textContent = 'Para administrar, este equipo debe estar autorizado. Pídalo en el panel.';
        a.style.display = 'block';
        a.scrollIntoView({ block: 'nearest' });
      } else cIrModoAdmin();
    }
  });
  try {
    // El número de «Tareas de dirección» vencidas. Sin señal o con error simplemente no hay globo: la tarjeta se ve igual.
    try { vencidas = Number((await api('/tareas-direccion/resumen')).vencidas) || 0; } catch (_) { vencidas = 0; }
    const r = await cCargar(usuario.id, '/mas');
    pintarMenu(r.datos.secciones || {});
    cPintarEstado(r, 'estado');
  } catch (err) { const e = document.getElementById('error-carga'); e.textContent = err.message || 'No se pudo cargar.'; e.classList.add('visible'); }
})();
</script>
</body>
</html>
